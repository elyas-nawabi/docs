  <body>
    
    <script>
      let url = "assets/doc/shared_layout.yaml";
      let token = sessionStorage.getItem("token") || '';
      function pageNavigator(path){
        window.ui = SwaggerUIBundle({
        url: path,
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl
        ],
        layout: "StandaloneLayout",
        requestInterceptor: (request) => {
              request.headers['Authorization'] = `Bearer ${token}`;
              return request;
          }
      });
      }
      function setAuthorizationToken() {
           token = document.getElementById('tokenInput').value;
           sessionStorage.setItem("token", token)
           document.querySelector('#btnToken').innerHTML = 
            sessionStorage.getItem("token") ? 
            "<div style='color:green'>Token Verified</div>" : 
            "<div style='color:red'> Set Token </div>";
          }

    </script>
     <header>
