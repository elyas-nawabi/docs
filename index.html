<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Umbrella API</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="description" content="Umbrella" />
    <link rel="stylesheet" type="text/css" href="assets/css/swagger-ui.css" />
    <link rel="shortcut icon" href="assets/images/tryton-logo.jpg" />
    <link rel="stylesheet" type="text/css" href="assets/css/index.css" />
    <link rel="stylesheet" type="text/css" href="assets/css/sidebar.css" />
    <!-- Lucide Icons -->
    <link href="https://cdn.jsdelivr.net/npm/lucide-static/font/lucide.css" rel="stylesheet">
    <style>
      .wrapper .float-right {
        display: none !important;
      }
      hgroup .title {
        display: none;
      }
      .swagger-ui .info {
        margin: 20px 0;
      }
    </style>
  </head>

  <body>
    <div class="app-container">
      <!-- Header -->
      <header class="app-header">
        <div class="header-left">
          <button class="menu-toggle" id="menuToggle" title="Toggle Menu">
            <i class="icon-menu" style="font-size: 20px;"></i>
          </button>
          <span class="app-logo">Umbrella</span>
          <div class="action-search">
            <i class="icon-flag"></i>
            <input type="text" id="actionSearch" placeholder="Action" />
          </div>
        </div>
        <div class="header-right">
          <div class="user-info">
            <div class="user-avatar">A</div>
            <span>Administrator [USD]</span>
          </div>
          <button class="logout-btn" title="Logout">
            <i class="icon-log-out" style="font-size: 18px;"></i>
          </button>
        </div>
      </header>

      <!-- Body -->
      <div class="app-body">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
          <div class="sidebar-content">
            <ul class="menu-tree" id="menuTree"></ul>
          </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
          <div class="auth-bar" id="authBar">
            <div class="auth-bar-title">Authorization</div>
            <div class="auth-bar-controls">
              <input
                type="password"
                id="tokenInput"
                placeholder="Paste token (JWT) or 'Bearer …'"
                autocomplete="off"
                spellcheck="false"
              />
              <button type="button" id="setTokenBtn">Set Token</button>
              <span class="auth-bar-status" id="tokenStatus"></span>
            </div>
          </div>
          <div id="swagger-ui"></div>
        </main>
      </div>
    </div>

    <!-- Scripts -->
    <script src="assets/js/swagger-ui-bundle.js"></script>
    <script src="assets/js/swagger-ui-standalone-preset.js"></script>
    <script>
      // Swagger UI Configuration
      let url = "assets/doc/umbrella/umbrella/auth/auth.yaml";

      function getStoredToken() {
        return sessionStorage.getItem("token") || "";
      }

      function getSwaggerAuthorizedToken() {
        try {
          if (!window.ui || !window.ui.getSystem) return "";
          const sys = window.ui.getSystem();
          if (!sys || !sys.getState) return "";
          const state = sys.getState();
          if (!state || !state.getIn) return "";
          const authorized = state.getIn(["auth", "authorized"]);
          if (!authorized) return "";

          // authorized is usually an Immutable.Map
          if (typeof authorized.toJS === "function") {
            const obj = authorized.toJS();
            for (const val of Object.values(obj || {})) {
              if (val && typeof val.value === "string" && val.value.trim()) {
                return val.value.trim();
              }
            }
          }

          return "";
        } catch (e) {
          return "";
        }
      }

      function normalizeAuthHeader(raw) {
        const trimmed = String(raw || "").trim();
        if (!trimmed) return "";
        return trimmed.toLowerCase().startsWith("bearer ") ? trimmed : `Bearer ${trimmed}`;
      }

      function pageNavigator(path) {
        window.ui = SwaggerUIBundle({
          url: path,
          dom_id: "#swagger-ui",
          deepLinking: true,
          presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
          plugins: [SwaggerUIBundle.plugins.DownloadUrl],
          layout: "StandaloneLayout",
          requestInterceptor: (request) => {
            const reqUrl = String(request.url || "");
            const isAssetRequest = reqUrl.includes("assets/");

            const stored = getStoredToken();
            const swaggerAuthorized = getSwaggerAuthorizedToken();
            const authHeader = normalizeAuthHeader(stored || swaggerAuthorized);

            // Block executing API requests if token isn't set.
            // Allow loading local docs/assets without a token.
            if (!isAssetRequest && !authHeader) {
              const msg = "Token is required. Please set/validate the token first.";
              const statusEl = document.getElementById("tokenStatus");
              if (statusEl) statusEl.textContent = msg;
              // Do not throw here: Swagger UI can end up with a null response object
              // and crash while rendering the response panel.
              // Let the request go through and rely on the server's 401/403 response.
              return request;
            }

            if (authHeader) {
              request.headers["Authorization"] = authHeader;
            }
            return request;
          },
        });
      }

      // Initialize Swagger UI
      window.onload = function () {
        pageNavigator(url);
      };

      function refreshTokenUI() {
        const input = document.getElementById("tokenInput");
        const status = document.getElementById("tokenStatus");
        if (!input || !status) return;

        const stored = getStoredToken();
        if (!stored) {
          status.textContent = "Token not set";
          input.value = "";
          return;
        }

        status.textContent = "Token set";
        // Don't echo the token back into the field.
        input.value = "";
      }

      document.addEventListener("DOMContentLoaded", function () {
        const setBtn = document.getElementById("setTokenBtn");
        const tokenInput = document.getElementById("tokenInput");
        const status = document.getElementById("tokenStatus");

        refreshTokenUI();

        if (setBtn && tokenInput) {
          setBtn.addEventListener("click", function () {
            const raw = String(tokenInput.value || "").trim();
            if (!raw) {
              if (status) status.textContent = "Please enter a token";
              return;
            }

            // Store exactly what user entered; interceptor normalizes to Bearer.
            sessionStorage.setItem("token", raw);
            refreshTokenUI();
          });
        }
      });

      // Sidebar Toggle
      document.getElementById("menuToggle").addEventListener("click", function () {
        document.getElementById("sidebar").classList.toggle("collapsed");
      });

      function createMenuItem(node) {
        const li = document.createElement("li");
        li.className = "menu-tree-item";

        const header = document.createElement("div");
        header.className = "menu-item-header";

        const hasChildren = Array.isArray(node.children) && node.children.length > 0;
        if (hasChildren) {
          header.setAttribute("data-has-children", "true");
        } else if (node.path) {
          header.setAttribute("data-path", node.path);
        }

        const expand = document.createElement("span");
        expand.className = "menu-expand-icon" + (hasChildren ? "" : " hidden");
        if (hasChildren) {
          const chevron = document.createElement("i");
          chevron.className = "icon-chevron-right";
          expand.appendChild(chevron);
        }

        const icon = document.createElement("span");
        icon.className = "menu-icon";
        const iconI = document.createElement("i");
        iconI.className = node.icon || "icon-folder";
        icon.appendChild(iconI);

        const label = document.createElement("span");
        label.className = "menu-label";
        label.textContent = node.label || "";

        header.appendChild(expand);
        header.appendChild(icon);
        header.appendChild(label);

        if (!hasChildren) {
          const fav = document.createElement("span");
          fav.className = "menu-favorite";
          const star = document.createElement("i");
          star.className = "icon-star";
          fav.appendChild(star);
          header.appendChild(fav);
        }

        li.appendChild(header);

        if (hasChildren) {
          const ul = document.createElement("ul");
          ul.className = "submenu-tree";
          node.children.forEach((child) => ul.appendChild(createMenuItem(child)));
          li.appendChild(ul);
        }

        return li;
      }

      async function loadAndRenderMenu() {
        const menuTree = document.getElementById("menuTree");
        if (!menuTree) return;

        try {
          const res = await fetch("assets/menu.json", { cache: "no-store" });
          const data = await res.json();

          menuTree.innerHTML = "";
          data.forEach((node) => menuTree.appendChild(createMenuItem(node)));
        } catch (e) {
          // If the site is opened via file://, fetch may fail.
          // Keep the menu empty instead of rendering incorrect/broken items.
          console.warn("Failed to load menu.json", e);
        }
      }

      // Menu Tree Functionality (event delegation)
      document.getElementById("menuTree").addEventListener("click", function (e) {
        const header = e.target.closest(".menu-item-header");
        if (!header) return;

        const hasChildren = header.getAttribute("data-has-children") === "true";
        const path = header.getAttribute("data-path");

        if (hasChildren) {
          const submenu = header.nextElementSibling;
          const expandIcon = header.querySelector(".menu-expand-icon");
          if (submenu && submenu.classList.contains("submenu-tree")) {
            submenu.classList.toggle("open");
            if (expandIcon) expandIcon.classList.toggle("expanded");
          }
          return;
        }

        if (path) {
          pageNavigator(path);
          document.querySelectorAll(".menu-item-header").forEach(function (h) {
            h.classList.remove("active");
          });
          header.classList.add("active");
        }
      });

      // Build the menu once the DOM is ready
      document.addEventListener("DOMContentLoaded", loadAndRenderMenu);

      // Action Search - Filter menu items
      document.getElementById("actionSearch").addEventListener("input", function (e) {
        const query = e.target.value.toLowerCase().trim();
        const menuItems = document.querySelectorAll(".menu-tree-item");

        if (!query) {
          // Show all items when search is empty
          menuItems.forEach(function (item) {
            item.style.display = "";
          });
          // Collapse all submenus
          document.querySelectorAll(".submenu-tree").forEach(function (submenu) {
            submenu.classList.remove("open");
          });
          document.querySelectorAll(".menu-expand-icon").forEach(function (icon) {
            icon.classList.remove("expanded");
          });
          return;
        }

        menuItems.forEach(function (item) {
          const label = item.querySelector(".menu-label");
          if (label) {
            const text = label.textContent.toLowerCase();
            if (text.includes(query)) {
              item.style.display = "";
              // Show parent items
              let parent = item.parentElement;
              while (parent) {
                if (parent.classList && parent.classList.contains("submenu-tree")) {
                  parent.classList.add("open");
                  const parentHeader = parent.previousElementSibling;
                  if (parentHeader) {
                    const expandIcon = parentHeader.querySelector(".menu-expand-icon");
                    if (expandIcon) {
                      expandIcon.classList.add("expanded");
                    }
                  }
                }
                if (parent.classList && parent.classList.contains("menu-tree-item")) {
                  parent.style.display = "";
                }
                parent = parent.parentElement;
              }
            } else {
              // Check if any children match
              const childLabels = item.querySelectorAll(".submenu-tree .menu-label");
              let hasMatchingChild = false;
              childLabels.forEach(function (childLabel) {
                if (childLabel.textContent.toLowerCase().includes(query)) {
                  hasMatchingChild = true;
                }
              });

              if (hasMatchingChild) {
                item.style.display = "";
                const submenu = item.querySelector(".submenu-tree");
                if (submenu) {
                  submenu.classList.add("open");
                  const expandIcon = item.querySelector(".menu-expand-icon");
                  if (expandIcon) {
                    expandIcon.classList.add("expanded");
                  }
                }
              } else {
                item.style.display = "none";
              }
            }
          }
        });
      });
    </script>
  </body>
</html>
