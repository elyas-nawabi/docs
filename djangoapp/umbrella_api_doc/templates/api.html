<!-- HTML for static distribution bundle build -->
{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Umbrella"
    />
    <title>Umbrella API</title>
    <link rel="stylesheet" type="text/css" href= {% static "css/swagger-ui.css" %} />
    <link rel="shortcut icon" href={% static 'images/favicon-32x32.png' %} />
    {% comment %} <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@4.5.0/swagger-ui.css" /> {% endcomment %}
    <style>
        .topbar{
          display: none !important;
        }
        html
        {
          box-sizing: border-box;
          overflow: -moz-scrollbars-vertical;
          overflow-y: scroll;
        }
  
        *,
        *:before,
        *:after
        {
          box-sizing: inherit;
        }
  
        body
        {
          margin:0;
          background: #fafafa;
        }
      </style>

    </head>
  <body>
  <div id="swagger-ui"></div>
  {% comment %} <script src="https://unpkg.com/swagger-ui-dist@4.5.0/swagger-ui-bundle.js" crossorigin></script>
  <script src="https://unpkg.com/swagger-ui-dist@4.5.0/swagger-ui-standalone-preset.js" crossorigin></script> {% endcomment %}
  <script src={% static "js/swagger-ui-bundle.js" %} charset="UTF-8" crossorigin> </script>
  <script src={% static "js/swagger-ui-standalone-preset.js" %} charset="UTF-8" crossorigin> </script>
  <script>
    window.onload = () => {
      window.ui = SwaggerUIBundle({
        url: '{% static 'doc/api_doc.yaml' %}',
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        plugins: [
        SwaggerUIBundle.plugins.DownloadUrl
        ],
        layout: "StandaloneLayout",
      });
    };
  </script>
  </body>
</html>
