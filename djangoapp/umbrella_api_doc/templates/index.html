<!-- HTML for static distribution bundle build -->
{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Umbrella"
    />
    <title>Umbrella API</title>
    <link rel="stylesheet" type="text/css" href= {% static "css/swagger-ui.css" %} />
    <link rel="shortcut icon" href={% static 'images/tryton-logo.jpg' %} />
    <link rel="stylesheet" type="text/css" href={% static "css/index.css" %} />
    <style>
        .topbar{
          display: none !important;
        }
        html
        {
          box-sizing: border-box;
          overflow: -moz-scrollbars-vertical;
          overflow-y: scroll;
        }
  
        *,
        *:before,
        *:after
        {
          box-sizing: inherit;
        }
  
        body
        {
          margin:0;
          background: #fafafa;
        }
      </style>

    </head>
   
  <body>
    <script>
      let url = "{% static 'doc/api_doc.yaml' %}"
    </script>
    <div id="swagger-ui"></div>
    <script src={% static "js/swagger-ui-bundle.js" %} charset="UTF-8" crossorigin> </script>
    <script src={% static "js/swagger-ui-standalone-preset.js" %} charset="UTF-8" crossorigin> </script>
    <script src={% static "js/swagger-initializer.js" %} charset="UTF-8" crossorigin> </script>
  </body>
</html>
