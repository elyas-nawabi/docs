schema:
  properties:
    id:
      type: integer
      description: Unique identifier for the mail activity
    res_name:
      type: string
      description: Name of the related resource
    activity_type:
      type: integer
      description: ID of the activity type
    user:
      type: integer
      description: ID of the user assigned to the activity
    summary:
      type: string
      description: Summary/description of the activity
    date_deadline:
      type: string
      format: date
      description: Deadline date for the activity
    date_done:
      type: string
      format: date
      nullable: true
      description: Date when the activity was completed
    state:
      type: string
      description: Current state of the activity (planned, done, cancelled, etc.)
    res_model:
      type: string
      description: Model name of the related resource
    res:
      type: integer
      description: ID of the related resource
    activity_category:
      type: string
      description: Category of the activity
    activity_decoration:
      type: string
      description: Decoration type for the activity
    icon:
      type: string
      description: Icon to display for the activity
    note:
      type: string
      description: Additional notes for the activity
    automated:
      type: boolean
      description: Whether the activity is automated
    user_tz:
      type: string
      description: User's timezone
    request_partner:
      type: integer
      nullable: true
      description: ID of the request partner
    recommended_activity_type:
      type: integer
      nullable: true
      description: ID of the recommended next activity type
    previous_activity_type:
      type: integer
      nullable: true
      description: ID of the previous activity type
    has_recommended_activities:
      type: boolean
      description: Whether there are recommended activities
    chaining_type:
      type: string
      description: Type of activity chaining

example:
  id: 123
  res_name: "Customer A"
  activity_type: 1
  user: 1
  summary: "Follow up call"
  date_deadline: "2024-01-20"
  date_done: null
  state: "planned"
  res_model: "res.partner"
  res: 456
  activity_category: "phone"
  activity_decoration: "info"
  icon: "phone"
  note: "Call customer to follow up on quote"
  automated: false
  user_tz: "UTC"
  request_partner: null
  recommended_activity_type: null
  previous_activity_type: null
  has_recommended_activities: false
  chaining_type: "suggest"
