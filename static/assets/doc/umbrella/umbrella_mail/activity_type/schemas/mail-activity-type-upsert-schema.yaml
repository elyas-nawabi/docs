type: object
properties:
  name:
    type: string
    description: Name of the activity type
    example: "Phone Call"
  summary:
    type: string
    description: Summary/description of the activity type
    example: "Make a phone call"
  delay_label:
    type: string
    description: Human-readable delay label
    example: "2 days"
  delay_from:
    type: string
    description: Reference point for delay calculation
    example: "previous_activity"
  res_model:
    type: string
    description: Model name this activity type applies to
    example: "res.partner"
  icon:
    type: string
    description: Icon to display for this activity type
    example: "phone"
  sequence:
    type: integer
    description: Sequence number for ordering
    example: 1
  delay_count:
    type: integer
    description: Number of delay units
    example: 2
  delay_unit:
    type: string
    description: Unit for delay (days, hours, etc.)
    example: "days"
  decoration_type:
    type: string
    description: Type of decoration for the activity
    example: "info"
  triggered_next_type:
    type: integer
    nullable: true
    description: ID of the next activity type to trigger
    example: null
  chaining_type:
    type: string
    description: Type of activity chaining
    example: "suggest"
  suggested_next_types:
    type: array
    description: List of suggested next activity type IDs
    items:
      type: integer
    example: [2, 3]
  previous_types:
    type: array
    description: List of previous activity type IDs
    items:
      type: integer
    example: [1]
  category:
    type: string
    description: Category of the activity type
    example: "phone"
  default_user:
    type: integer
    description: Default user assigned to this activity type
    example: 1
  default_note:
    type: string
    description: Default note for this activity type
    example: "Call the customer"
  keep_done:
    type: boolean
    description: Whether to keep completed activities
    example: true
  initial_res_model:
    type: string
    description: Initial model this activity type applies to
    example: "res.partner"
  res_model_change:
    type: boolean
    description: Whether the model can be changed
    example: false

required:
  - name
  - summary
  - res_model

example:
  name: "Phone Call"
  summary: "Make a phone call"
  delay_label: "2 days"
  delay_from: "previous_activity"
  res_model: "res.partner"
  icon: "phone"
  sequence: 1
  delay_count: 2
  delay_unit: "days"
  decoration_type: "info"
  triggered_next_type: null
  chaining_type: "suggest"
  suggested_next_types: [2, 3]
  previous_types: [1]
  category: "phone"
  default_user: 1
  default_note: "Call the customer"
  keep_done: true
  initial_res_model: "res.partner"
  res_model_change: false 