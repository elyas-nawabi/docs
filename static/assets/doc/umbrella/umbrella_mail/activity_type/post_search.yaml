post:
  tags:
    - mail activity type
  summary: Search mail activity types
  description: List of Mail Activity Types with filtering and pagination
  operationId: searchMailActivityTypes
  requestBody:
    required: true
    description: Search criteria and pagination
    content:
      application/json:
        schema:
          $ref: '../../../api_doc.yaml#/components/schemas/Filter'
  responses:
    '200':
      description: List of mail activity types
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: 'schema.yaml#/schema'
              errors:
                type: object
                nullable: true
              pagination:
                type: object
                nullable: true
              status:
                type: integer
              success_message:
                type: string
                nullable: true
          example:
            data:
              - id: 1
                name: "Phone Call"
                summary: "Make a phone call"
                delay_label: "2 days"
                delay_from: "previous_activity"
                res_model: "res.partner"
                icon: "phone"
                sequence: 1
            errors: null
            pagination:
              page: 1
              per_page: 20
              total: 1
            status: 200
            success_message: null
    '401':
      description: >-
        401 Unauthorized: The server could not verify that you are
        authorized to access the URL requested. You either supplied the
        wrong credentials (e.g. a bad password), or your browser doesn't
        understand how to supply the credentials required.
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP401' 