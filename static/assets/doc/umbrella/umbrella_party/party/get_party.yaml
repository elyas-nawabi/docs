    post:
      tags:
        - party
      summary: Get party details.
      description: Get party details.
      operationId: getParties
      requestBody:
        description: If you wish to apply filtering, please set the criteria; otherwise, send an empty JSON request.
        content:
          application/json:
            schema:
              type: object
              $ref: '../../../api_doc.yaml#/components/schemas/Filter'
      responses:
        '200':
          description: List of parties.
          content:
            application/json:
              schema:
                  type: object
                  properties:
                    data:
                      type: array
                      properties:
                        code: 
                          type: string
                        create_date: 
                          type: string 
                          format: date 
                        create_uid: 
                          type: integer
                        create_uid_:
                          $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
                        deceased: 
                          type: boolean
                        deposit: 
                          type: integer
                        federation_account: 
                          type: string
                        id: 
                          type: integer
                        internal_user: 
                          type: integer
                        internal_user_: 
                          $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
                        is_healthprof: 
                          type: boolean
                        is_institution: 
                          type: boolean
                        is_insurance_company: 
                          type: boolean
                        is_patient: 
                          type: boolean
                        is_person: 
                          type: boolean
                        is_pharmacy: 
                          type: boolean
                        lang: 
                          type: integer
                        lastname: 
                          type: string
                        name: 
                          type: string
                        payable_today:  
                          type: integer
                        rec_name: 
                          type: string
                        receivable_today:   
                          type: integer
                        tax_identifier: 
                          type: string
                        write_date:
                          type: string
                          format: date 
                        write_uid:
                          type: integer
                        write_uid_:
                          $ref: '../../../api_doc.yaml#/components/schemas/CommonType'

                    errors:
                      type: object
                    pagination:
                      properties:
                        page:
                          type: integer
                        per_page:
                          type: integer
                        total_pages:
                          type: integer
                        total_records:
                          type: integer
                    status:
                      type: integer
                    success_message:
                      type: string
              example:
                data:
                  - code: 71c847ef-3c72-498e-a7c2-0bc427bd8fbc-Milestone
                    create_date: '2024-08-23T05:04:14.073168'
                    create_uid: 1
                    create_uid_:
                      id: 1
                      name: Administrator
                    deceased: false
                    deposit: 0
                    federation_account: XXXYSQ260VIV
                    id: 2
                    internal_user: 
                    internal_user_: {}
                    is_healthprof: false
                    is_institution: false
                    is_insurance_company: false
                    is_patient: true
                    is_person: true
                    is_pharmacy: false
                    lang: 
                    lastname: ''
                    name: elyas
                    payable_today: 0
                    rec_name: elyas
                    receivable_today: 0
                    tax_identifier: 
                    write_date: '2024-08-23T05:04:14.073168'
                    write_uid: 1
                    write_uid_:
                      id: 1
                      name: Administrator

                errors: null
                pagination:
                  page: 1
                  per_page: 100
                  total_pages: 1
                  total_records: 1
                status: 200
                success_message: null
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'
   
    