    post:
      tags:
        - health institution
      summary: Get health institution details.
      description: Get health institution details.
      operationId: getHealthInstitutions
      requestBody:
        description: If you wish to apply filtering, please set the criteria; otherwise, send an empty JSON request.
        content:
          application/json:
            schema:
              type: object
              $ref: '../../../../api_doc.yaml#/components/schemas/Filter'
      responses:
        '200':
          description: List of health institutions.
          content:
            application/json:
              schema:
                  type: object
                  properties:
                    data:
                      type: array
                      properties:
                        create_date: 
                          type: string 
                          format: date 
                        create_uid: 
                          type: integer
                        create_uid_:
                          $ref: '../../../../api_doc.yaml#/components/schemas/CommonType'
                        heliport: 
                          type: boolean
                        id: 
                          type: integer
                        institution_type: 
                          type: string
                        name: 
                          type: integer
                        name_:
                          $ref: '../../../../api_doc.yaml#/components/schemas/CommonType'
                        operating_room: 
                          type: boolean
                        rec_name: 
                          type: string
                        trauma_center: 
                          type: boolean
                        write_date:
                          type: string
                          format: date 
                        write_uid:
                          type: integer
                        write_uid_:
                          $ref: '../../../../api_doc.yaml#/components/schemas/CommonType'

                    errors:
                      type: object
                    pagination:
                      type: object
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_pages:
                        type: integer
                      total_records:
                        type: integer
                    status:
                      type: integer
                    success_message:
                      type: string
                      nullable: true
              example:
                data:
                  - create_date: '2024-07-16T06:12:41.603115'
                    create_uid: 1
                    create_uid_:
                      id: 1
                      name: Administrator
                    heliport: false
                    id: 1
                    institution_type: clinic
                    name: 1
                    name_:
                      id: 1
                      name: Milestone
                    operating_room: false
                    rec_name: Milestone
                    trauma_center: false
                    write_date: 
                    write_uid: 
                    write_uid_: {}

                error: null
                pagination:
                  page: 1
                  per_page: 100
                  total_pages: 1
                  total_records: 9
                status: 200
                success_message: null
        
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../../../api_doc.yaml#/components/schemas/HTTP401'
    
    