        - gnuhealth command
      summary: Create a gnuhealth command.
      description: Create a gnuhealth command.
      operationId: postGnuHealthCommandById
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              $ref: 'schemas/create-gnuhealth-command.yaml'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: 'schema.yaml'
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../../../api_doc.yaml#/components/schemas/HTTP401'

