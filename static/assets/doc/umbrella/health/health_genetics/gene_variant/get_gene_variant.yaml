    post:
      tags:
        - gene variant
      summary: Get gene variant details.
      description: Get gene variant details.
      operationId: getGeneVariants
      requestBody:
        description: If you wish to apply filtering, please set the criteria; otherwise, send an empty JSON request.
        content:
          application/json:
            schema:
              type: object
              $ref: '../../../../api_doc.yaml#/components/schemas/Filter'
      responses:
        '200':
          description: List of gene variants.
          content:
            application/json:
              schema:
                  type: object
                  properties:
                    data:
                      type: array
                      properties:
                        aa_change:
                          type: string
                        create_date: 
                          type: string 
                          format: date 
                        create_uid: 
                          type: integer
                        create_uid_:
                          $ref: '../../../../api_doc.yaml#/components/schemas/CommonType'
                        dbsnp_url: 
                          type: string
                        id: 
                          type: integer
                        name: 
                          type: integer
                        name_:
                          $ref: '../../../../api_doc.yaml#/components/schemas/CommonType'
                        rec_name:  
                          type: string
                        significance: 
                          type: string
                        variant: 
                          type: string
                        write_date:
                          type: string
                          format: date 
                        write_uid:
                          type: integer
                        write_uid_:
                          $ref: '../../../../api_doc.yaml#/components/schemas/CommonType'
                    errors:
                      type: object
                    pagination:
                      type: object
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_pages:
                        type: integer
                      total_records:
                        type: integer
                    status:
                      type: integer
                    success_message:
                      type: string
                      nullable: true
              example:
                data:
                  - aa_change: p.Thr367Asn
                    create_date: '2024-05-27T12:29:51.795048'
                    create_uid: 0
                    create_uid_:
                      id: 0
                      name: Root
                    dbsnp_url: https://www.ncbi.nlm.nih.gov/snp/rs1047303
                    id: 1
                    name: 12187
                    name_:
                      id: 12187
                      name: HSD3B1 (P14060) :hydroxy-delta-5-steroid dehydrogenase, 3 beta- and steroid
                        delta-isomerase 1
                    rec_name: 'VAR_000005 : p.Thr367Asn'
                    significance: lbb
                    variant: VAR_000005
                    write_date: 
                    write_uid: 
                    write_uid_: {}
                error: null
                pagination:
                  page: 1
                  per_page: 100
                  total_pages: 1
                  total_records: 9
                status: 200
                success_message: null
        
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../../../api_doc.yaml#/components/schemas/HTTP401'
    
    