    post:
      tags:
        - new born
      summary: Get new born details.
      description: Get new born details.
      operationId: getNewBorn
      requestBody:
        description: If you wish to apply filtering, please set the criteria; otherwise, send an empty JSON request.
        content:
          application/json:
            schema:
              type: object
              $ref: '../../../../api_doc.yaml#/components/schemas/Filter'
      responses:
        '200':
          description: List of new borns.
          content:
            application/json:
              schema:
                  type: object
                  properties:
                    data:
                      type: array
                      properties:
                        create_date: 
                          type: string 
                          format: date 
                        create_uid: 
                          type: integer
                        create_uid_:
                          $ref: '../../../../api_doc.yaml#/components/schemas/CommonType'
                        birth_date: 
                          type: string 
                          format: date
                        cephalic_perimeter: 
                          type: integer
                        id: 
                          type: integer
                        length: 
                          type: integer
                        mother: 
                          type: integer
                        mother_:
                          $ref: '../../../../api_doc.yaml#/components/schemas/CommonType'
                        patient: 
                          type: integer
                        patient_:
                          $ref: '../../../../api_doc.yaml#/components/schemas/CommonType'
                        rec_name: 
                          type: string 
                        sex: 
                          type: string
                        weight: 
                          type: integer
                        write_date:
                          type: string
                          format: date 
                        write_uid:
                          type: integer
                        write_uid_:
                          $ref: '../../../../api_doc.yaml#/components/schemas/CommonType'
                    errors:
                      type: object
                    pagination:
                      type: object
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_pages:
                        type: integer
                      total_records:
                        type: integer
                    status:
                      type: integer
                    success_message:
                      type: string
                      nullable: true
              example:
                data:
                  - birth_date: '1990-01-13T21:45:00'
                    cephalic_perimeter: 1
                    create_date: '2024-08-14T06:43:18.496098'
                    create_uid: 1
                    create_uid_:
                      id: 1
                      name: Administrator
                    id: 1
                    length: 2
                    mother: 1
                    mother_:
                      id: 1
                      name: ''
                    patient: 3
                    patient_:
                      id: 3
                      name: Adel
                    rec_name: None
                    sex: m
                    weight: 1
                    write_date: 
                    write_uid: 
                    write_uid_: {}

                error: null
                pagination:
                  page: 1
                  per_page: 100
                  total_pages: 1
                  total_records: 9
                status: 200
                success_message: null
        
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../../../api_doc.yaml#/components/schemas/HTTP401'
    
    