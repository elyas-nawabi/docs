                        mealtime: 
                          type: string
                        name: 
                          type: integer
                        name_:
                          $ref: '../../../../api_doc.yaml#/components/schemas/CommonType'
                        rec_name: 
                          type: string
                        state: 
                          type: string
                        write_date:
                          type: string
                          format: date 
                        write_uid:
                          type: integer
                        write_uid_:
                          $ref: '../../../../api_doc.yaml#/components/schemas/CommonType'
                    errors:
                      type: object
                    pagination:
                      type: object
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_pages:
                        type: integer
                      total_records:
                        type: integer
                    status:
                      type: integer
                    success_message:
                      type: string
                      nullable: true
              example:
                data:
                  create_date: '2024-12-04T04:56:54.503550'
                  create_uid: 1
                  create_uid_:
                    id: 1
                    name: Administrator
                  id: 2
                  meal_order: MEAL002
                  mealtime: breakfast
                  name: 1
                  name_:
                    id: 1
                    name: INPAC001:abacavir (ABC):Milestone
                  rec_name: '2'
                  state: draft
                  write_date: 
                  write_uid:
                error: null
                pagination:
                  page: 1
                  per_page: 100
                  total_pages: 1
                  total_records: 9
                status: 200
                success_message: null
        
        '401':
