    post:
      tags:
        - health service
      summary: Get health service details.
      description: Get health service details.
      operationId: getHealthServices
      requestBody:
        description: If you wish to apply filtering, please set the criteria; otherwise, send an empty JSON request.
        content:
          application/json:
            schema:
              type: object
              $ref: '../../../../api_doc.yaml#/components/schemas/Filter'
      responses:
        '200':
          description: List of health services.
          content:
            application/json:
              schema:
                  type: object
                  properties:
                    data:
                      type: array
                      properties:
                        create_date: 
                          type: string 
                          format: date 
                        create_uid: 
                          type: integer
                        create_uid_:
                          $ref: '../../../../api_doc.yaml#/components/schemas/CommonType'
                        desc: 
                          type: string
                        id: 
                          type: integer
                        name: 
                          type: string
                        patient: 
                          type: integer
                        patient_:
                          $ref: '../../../../api_doc.yaml#/components/schemas/CommonType'
                        rec_name: 
                          type: string
                        service_date: 
                          type: string
                          format: date
                        state: 
                          type: string
                        write_date:
                          type: string
                          format: date 
                        write_uid:
                          type: integer
                        write_uid_:
                          $ref: '../../../../api_doc.yaml#/components/schemas/CommonType'
                    errors:
                      type: object
                    pagination:
                      type: object
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_pages:
                        type: integer
                      total_records:
                        type: integer
                    status:
                      type: integer
                    success_message:
                      type: string
                      nullable: true
              example:
                data:
                  - create_date: '2024-08-03T08:44:22.502245'
                    create_uid: 1
                    create_uid_:
                      id: 1
                      name: Administrator
                    desc: test data
                    id: 1
                    name: SERV 2024/001
                    patient: 17
                    patient_:
                      id: 17
                      name: Milestone
                    rec_name: SERV 2024/001
                    service_date: '2024-08-03'
                    state: draft
                    write_date: 
                    write_uid: 
                    write_uid_: {}
                error: null
                pagination:
                  page: 1
                  per_page: 100
                  total_pages: 1
                  total_records: 9
                status: 200
                success_message: null
        
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../../../api_doc.yaml#/components/schemas/HTTP401'
    
    