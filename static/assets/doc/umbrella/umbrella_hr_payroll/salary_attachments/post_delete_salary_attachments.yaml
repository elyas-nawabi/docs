post:
  tags:
    - salary_attachments
  summary: Create Salary Attachments.
  description: Create Salary Attachments.
  operationId: createSalaryattachments
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: 'schemas/create-salary-attachments.yaml'
  responses:
    '201':
      description: Created
      content:
        application/json:
          schema:
            $ref: 'schema.yaml'
    '401':
      description: Unauthorized.
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'


delete:
  tags:
    - salary_attachments
  summary: Delete Salary Attachments.
  description: Delete one or more Salary Attachments by id.
  operationId: deleteSalaryattachments
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            ids:
              type: array
              items:
                type: integer
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP200'
    '401':
      description: Unauthorized.
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'

