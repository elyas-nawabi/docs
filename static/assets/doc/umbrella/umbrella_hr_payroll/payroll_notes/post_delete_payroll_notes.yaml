post:
  tags:
    - payroll_notes
  summary: Create Payroll Notes.
  description: Create Payroll Notes.
  operationId: createPayrollnotes
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: 'schemas/create-payroll-notes.yaml'
  responses:
    '201':
      description: Created
      content:
        application/json:
          schema:
            $ref: 'schema.yaml'
    '401':
      description: Unauthorized.
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'


delete:
  tags:
    - payroll_notes
  summary: Delete Payroll Notes.
  description: Delete one or more Payroll Notes by id.
  operationId: deletePayrollnotes
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            ids:
              type: array
              items:
                type: integer
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP200'
    '401':
      description: Unauthorized.
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'

