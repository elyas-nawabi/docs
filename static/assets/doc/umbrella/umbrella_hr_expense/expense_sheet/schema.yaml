schema:
  properties:
    data:
      type: array
      properties:
        id:
          type: integer
        name:
          type: string
        state:
          type: string
        company:
          type: integer
        company_:
          $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
        employee:
          type: integer
        employee_:
          $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
        department:
          type: integer
        department_:
          $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
        user:
          type: integer
        user_:
          $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
        total_amount:
          type: number
        currency:
          type: integer
        currency_:
          $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
        payment_state:
          type: string
        accounting_date:
          type: string
          format: date
        journal:
          type: integer
        journal_:
          $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
        is_editable:
          type: boolean
        expense_lines:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
              date:
                type: string
                format: date
              employee:
                type: integer
              company:
                type: integer
              product:
                type: integer
              product_uom:
                type: integer
              quantity:
                type: number
              description:
                type: string
              state:
                type: string
              sheet:
                type: integer
              tax_amount:
                type: number
              total_amount:
                type: number
              price_unit:
                type: number
              payment_mode:
                type: string
              vendor:
                type: integer
              account:
                type: integer
              taxes:
                type: array
                items:
                  $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
              accounting_date:
                type: string
                format: date
              is_editable:
                type: boolean
        nb_expense:
          type: integer
        approval_state:
          type: string
        approval_date:
          type: string
          format: date-time
        untaxed_amount:
          type: number
        total_tax_amount:
          type: number
        amount_residual:
          type: number
        payment_mode:
          type: string
        employee_journal:
          type: integer
        account_moves:
          type: array
          items:
            type: integer
        nb_account_move:
          type: integer
        can_reset:
          type: boolean
        can_approve:
          type: boolean
        cannot_approve_reason:
          type: string
        create_date:
          type: string
          format: date-time
        create_uid:
          type: integer
        create_uid_:
          $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
        write_date:
          type: string
          format: date-time
        write_uid:
          type: integer
        write_uid_:
          $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
    errors:
      type: object
      nullable: true
    pagination:
      type: object
      nullable: true
    status:
      type: integer
    success_message:
      type: string
      nullable: true

