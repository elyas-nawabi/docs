post:
  tags:
    - WorkingSchedules
  summary: Create a working schedule
  description: Create a new working schedule
  operationId: createWorkingSchedule
  requestBody:
    required: true
    description: Working schedule data
    content:
      application/json:
        schema:
          $ref: 'schemas/working-schedules-schema.yaml'
  responses:
    '201':
      description: Working schedule created successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  id:
                    type: integer
                    description: ID of the created mail activity
              errors:
                type: object
                nullable: true
              status:
                type: integer
              success_message:
                type: string
                nullable: true
          example:
            data:
              id: 123
            errors: null
            status: 201
            success_message: "Working schedule created successfully"
    '400':
      description: Bad Request - Invalid input data
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP400'
    '401':
      description: >-
        401 Unauthorized: The server could not verify that you are
        authorized to access the URL requested. You either supplied the
        wrong credentials (e.g. a bad password), or your browser doesn't
        understand how to supply the credentials required.
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'

delete:
  tags:
    - WorkingSchedules
  summary: Delete working schedules
  description: Delete multiple working schedules by IDs
  operationId: deleteWorkingSchedules
  requestBody:
    required: true
    description: IDs of mail activities to delete
    content:
      application/json:
        schema:
          $ref: '../../../api_doc.yaml#/components/schemas/DeleteRequestBody'
  responses:
    '200':
      description: Mail activities deleted successfully
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/DeleteApiResponse'
    '401':
      description: >-
        401 Unauthorized: The server could not verify that you are
        authorized to access the URL requested. You either supplied the
        wrong credentials (e.g. a bad password), or your browser doesn't
        understand how to supply the credentials required.
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP401' 