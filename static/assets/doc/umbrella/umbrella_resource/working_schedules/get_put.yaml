get:
  tags:
    - WorkingSchedules
  summary: Get a working schedule
  description: Get one Working Schedule by ID
  operationId: getWorkingSchedule
  parameters:
    - name: obj_id
      required: true
      in: path
      description: The ID of the working schedules to retrieve
      schema:
        type: integer
      example: 123
  responses:
    '200':
      description: working schedules details
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                $ref: 'schema.yaml#/schema'
              errors:
                type: object
                nullable: true
              status:
                type: integer
              success_message:
                type: string
                nullable: true
          example:
            data:
              id: 123
              name: "Morning Shift"
              resource: 456
              start_date: "2024-01-20T08:00:00Z"
              end_date: "2024-01-20T12:00:00Z"
            errors: null
            status: 200
            success_message: null
    '404':
      description: working schedules not found
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP404'
    '401':
      description: >-
        401 Unauthorized: The server could not verify that you are
        authorized to access the URL requested. You either supplied the
        wrong credentials (e.g. a bad password), or your browser doesn't
        understand how to supply the credentials required.
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'

put:
  tags:
    - WorkingSchedules
  summary: Update a working schedule
  description: Update an existing Working Schedule
  operationId: updateWorkingSchedule
  parameters:
    - name: obj_id
      required: true
      in: path
      description: The ID of the working schedules to update
      schema:
        type: integer
      example: 123
  requestBody:
    required: true
    description: Updated working schedules data
    content:
      application/json:
        schema:
          $ref: 'schemas/working-schedules-schema.yaml'
  responses:
    '200':
      description: working schedules updated successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                nullable: true
              errors:
                type: object
                nullable: true
              status:
                type: integer
              success_message:
                type: string
                nullable: true
          example:
            data: null
            errors: null
            status: 200
            success_message: "working schedules updated successfully"
    '400':
      description: Bad Request - Invalid input data
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP400'
    '404':
      description: working schedules not found
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP404'
    '401':
      description: >-
        401 Unauthorized: The server could not verify that you are
        authorized to access the URL requested. You either supplied the
        wrong credentials (e.g. a bad password), or your browser doesn't
        understand how to supply the credentials required.
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP401' 