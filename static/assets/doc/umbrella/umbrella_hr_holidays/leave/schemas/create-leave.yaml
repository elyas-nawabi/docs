type: object
properties:
  employee:
    type: integer
    example: 5
  leave_type:
    type: integer
    example: 2
  start_datetime:
    type: string
    format: date-time
    example: '2026-03-10T09:00:00'
  end_datetime:
    type: string
    format: date-time
    example: '2026-03-12T17:00:00'
  quantity:
    type: number
    example: 3.0
  reason:
    type: string
    example: Personal matters
required:
  - employee
  - leave_type
  - start_datetime
  - end_datetime
  - quantity

