type: object
properties:
  name:
    type: string
    example: Annual Leave
  company:
    type: integer
    example: 1
  requires_allocation:
    type: boolean
    example: true
  request_unit:
    type: string
    example: day
  unpaid:
    type: boolean
    example: false
  active:
    type: boolean
    example: true
required:
  - name
  - company

