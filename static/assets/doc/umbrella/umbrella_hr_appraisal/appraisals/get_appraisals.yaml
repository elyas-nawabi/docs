post:
  tags:
    - appraisals
  summary: Search appraisals.
  description: Returns a filtered list of appraisals (POST body uses the standard Umbrella filter object).
  operationId: searchAppraisals
  requestBody:
    description: If you wish to apply filtering, please set the criteria; otherwise, send an empty JSON request.
    content:
      application/json:
        schema:
          type: object
          $ref: '../../../api_doc.yaml#/components/schemas/Filter'
  responses:
    '200':
      description: List of appraisals.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    rec_name:
                      type: string
                    employee:
                      type: integer
                    employee_:
                      $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
                    company:
                      type: integer
                    company_:
                      $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
                    department:
                      type: integer
                      nullable: true
                    department_:
                      $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
                      nullable: true
                    date_close:
                      type: string
                      format: date
                    date_final_interview:
                      type: string
                      format: date
                      nullable: true
                    previous_appraisal_date:
                      type: string
                      format: date
                      nullable: true
                    next_appraisal_date:
                      type: string
                      format: date
                      nullable: true
                    assessment_note:
                      type: integer
                      nullable: true
                    assessment_note_:
                      $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
                      nullable: true
                    state:
                      type: string
                      description: 'One of: new, pending, done, cancel'
                    create_date:
                      type: string
                      format: date-time
                    create_uid:
                      type: integer
                    create_uid_:
                      $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
                    write_date:
                      type: string
                      format: date-time
                      nullable: true
                    write_uid:
                      type: integer
                      nullable: true
              error:
                type: object
                nullable: true
              pagination:
                type: object
                nullable: true
              status:
                type: integer
              success_message:
                type: string
                nullable: true
    '401':
      description: >-
        401 Unauthorized: The server could not verify that you are
        authorized to access the URL requested.
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'
