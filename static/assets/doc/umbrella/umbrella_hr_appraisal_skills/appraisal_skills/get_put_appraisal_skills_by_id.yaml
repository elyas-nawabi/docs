get:
  tags:
    - appraisal_skills
  summary: Get one appraisal skill line.
  description: Returns a single appraisal skill line by id.
  operationId: getAppraisalSkillById
  parameters:
    - name: obj_id
      in: path
      required: true
      schema:
        type: integer
      example: 1
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: 'schema.yaml'
    '401':
      description: >-
        401 Unauthorized: The server could not verify that you are
        authorized to access the URL requested.
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'
    '404':
      description: Not found.
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP404'

put:
  tags:
    - appraisal_skills
  summary: Update an appraisal skill line.
  description: Update fields on an existing appraisal skill line.
  operationId: updateAppraisalSkillById
  parameters:
    - name: obj_id
      in: path
      required: true
      schema:
        type: integer
      example: 1
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          $ref: 'schemas/create-appraisal-skills.yaml'
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: 'schema.yaml'
    '401':
      description: >-
        401 Unauthorized: The server could not verify that you are
        authorized to access the URL requested.
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'
