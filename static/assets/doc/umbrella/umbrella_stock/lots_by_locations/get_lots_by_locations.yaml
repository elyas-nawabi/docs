    post:
      tags:
        - lots by locations
      summary: Get lots by locations details.
      description: Get lots by locations details.
      operationId: getLotsByLocations
      requestBody:
        description: If you wish to apply filtering, please set the criteria; otherwise, send an empty JSON request.
        content:
          application/json:
            schema:
              type: object
              properties:
                context:
                  type: object
                  properties:
                    location: 
                      type: integer
                    forecast_date: 
                      type: string
                      format: date
                    company: 
                      type: integer
                    lot: 
                      type: integer
                    product: 
                      type: integer
                    quantity: 
                      type: number
                      format: decimal
                    forecast_quantity: 
                      type: number
                      format: decimal
                    default_uom: 
                      type: integer
            example:
              context:
                location: 5
                forecast_date: '2024-05-02'
                company: 1
                lot: 2
                product: 1
                quantity: 2
                forecast_quantity: 1.2
                default_uom: 1
      responses:
        '200':
          description: List of lots by locations.
          content:
            application/json:
              schema:
                  type: object
                  properties:
                    data:
                      type: array
                    errors:
                      type: object
                    pagination:
                      type: object
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_pages:
                        type: integer
                      total_records:
                        type: integer
                    status:
                      type: integer
                    success_message:
                      type: string
                      nullable: true
              example:
                data: []
                error: null
                pagination:
                  page: 1
                  per_page: 100
                  total_pages: 1
                  total_records: 9
                status: 200
                success_message: null
        
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'
    
    