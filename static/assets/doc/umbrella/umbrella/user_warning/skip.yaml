            application/json:
              schema:
                  type: object
                  properties:
                    data:
                      warning_name: 
                        type: string
                      always:
                        type: boolean
                    errors:
                      type: object
                      nullable: true
                    pagination:
                      type: object
                      nullable: true
                    status:
                      type: integer
                    success_message:
                      type: string
                      nullable: true
              example:
                data:
                  warning_name: overloaded_data
                  always: true
                error: null
                pagination: null
                status: 200
                success_message: null
