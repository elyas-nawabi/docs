schema:
  properties:
    data:
      type: object
      properties:
        id:
          type: integer
        rec_name:
          type: string
        name:
          type: string
        code:
          type: string
          nullable: true
          description: Short code used on tax reports (e.g. `B01`, `T01`).
        account:
          type: integer
          description: Root account template id this tax code belongs to.
        account_:
          $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
        parent:
          type: integer
          nullable: true
        parent_:
          $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
        description:
          type: string
          nullable: true
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
        lines:
          type: array
          description: Tax code line templates that wire tax amounts into this code bucket.
          items:
            type: object
            properties:
              id:
                type: integer
              operator:
                type: string
                enum: ['+', '-']
                description: Whether this line adds or subtracts the tax amount from the code total.
              tax:
                type: integer
                description: Tax template id whose amount feeds this code.
              tax_:
                $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
              amount:
                type: string
                enum: [tax, base]
                description: Whether to use the tax amount or base amount.
              type:
                type: string
                enum: [invoice, credit]
                description: Whether this line applies to invoice or credit note moves.
              code:
                type: integer
        childs:
          type: array
          description: Direct child tax code template nodes.
          items:
            type: object
            properties:
              id:
                type: integer
              rec_name:
                type: string
              childs:
                type: array
    errors:
      type: object
      nullable: true
    pagination:
      type: object
      nullable: true
    status:
      type: integer
    success_message:
      type: string
      nullable: true

example:
  data:
    id: 21
    rec_name: Output VAT Base
    name: Output VAT Base
    code: B01
    account: 1
    account_:
      id: 1
      name: Minimal Account Chart
    parent: 20
    parent_:
      id: 20
      name: VAT Codes
    description: Base amount for output VAT reporting
    start_date: null
    end_date: null
    lines:
      - id: 50
        operator: '+'
        tax: 10
        tax_:
          id: 10
          name: 21% VAT
        amount: base
        type: invoice
        code: 21
    childs: []
  errors: null
  pagination: null
  status: 200
  success_message: null
