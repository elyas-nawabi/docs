post:
  tags:
    - tax template
  summary: Search tax templates (root taxes).
  description: |
    Search global tax templates. The API applies a fixed filter: only **root** tax templates (`parent` is null) are returned.

    Each result includes a nested `childs` array. Use `GET /tax-templates/{obj_id}` for full fields on a specific node.

    **Note:** Tax templates are linked to an account template (chart root) via the `account` field.
  operationId: searchTaxTemplates
  requestBody:
    description: Optional filter criteria; send `{}` to list all root tax templates.
    content:
      application/json:
        schema:
          type: object
          $ref: '../../../api_doc.yaml#/components/schemas/Filter'
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    rec_name:
                      type: string
                    name:
                      type: string
                    description:
                      type: string
                    type:
                      type: string
                    childs:
                      type: array
                      description: Nested child tax templates.
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                          rec_name:
                            type: string
                          childs:
                            type: array
              errors:
                type: object
                nullable: true
              pagination:
                type: object
                properties:
                  page:
                    type: integer
                  per_page:
                    type: integer
                  total_pages:
                    type: integer
                  total_records:
                    type: integer
              status:
                type: integer
              success_message:
                type: string
                nullable: true
          example:
            data:
              - id: 10
                rec_name: 21% VAT
                name: 21% VAT
                description: Standard Rate VAT
                type: percentage
                childs: []
              - id: 11
                rec_name: 10% Reduced VAT
                name: 10% Reduced VAT
                description: Reduced Rate VAT
                type: percentage
                childs: []
            errors: null
            pagination:
              page: 1
              per_page: 100
              total_pages: 1
              total_records: 2
            status: 200
            success_message: null
    '401':
      description: >-
        401 Unauthorized: The server could not verify that you are
        authorized to access the URL requested. You either supplied the
        wrong credentials (e.g. a bad password), or your browser doesn't
        understand how to supply the credentials required.
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'
