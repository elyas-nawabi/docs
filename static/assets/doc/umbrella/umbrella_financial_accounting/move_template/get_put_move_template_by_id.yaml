get:
  tags:
    - move template
  summary: Get one move template.
  description: |
    Returns a single `account.move.template` record with all fields, including:
    - `keywords` — runtime variable definitions (name, type, required, digits).
    - `lines` — debit/credit account pairs with amount expressions and optional party/description.
  operationId: getMoveTemplateById
  parameters:
    - name: obj_id
      in: path
      required: true
      schema:
        type: integer
      example: 1
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: 'schema.yaml'
    '401':
      description: >-
        401 Unauthorized: The server could not verify that you are
        authorized to access the URL requested. You either supplied the
        wrong credentials (e.g. a bad password), or your browser doesn't
        understand how to supply the credentials required.
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'
    '404':
      description: 404 Not Found.
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP404'

put:
  tags:
    - move template
  summary: Update a move template.
  description: |
    Update fields, keywords, and/or lines on an existing move template.

    To update nested `keywords` or `lines`, include them in the request body as arrays of objects.
  operationId: updateMoveTemplateById
  parameters:
    - name: obj_id
      in: path
      required: true
      schema:
        type: integer
      example: 1
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          $ref: 'schemas/create-move-template.yaml'
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: 'schema.yaml'
    '401':
      description: >-
        401 Unauthorized: The server could not verify that you are
        authorized to access the URL requested. You either supplied the
        wrong credentials (e.g. a bad password), or your browser doesn't
        understand how to supply the credentials required.
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'
