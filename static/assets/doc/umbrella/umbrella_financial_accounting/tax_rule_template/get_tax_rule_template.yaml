post:
  tags:
    - tax rule template
  summary: Search tax rule templates.
  description: |
    Search global tax rule templates. Use filters to narrow by `account` (chart root id) or `kind`.

    **Note:** Tax rule templates are linked to an account template (chart root) via the `account` field. Unlike account/tax/type templates, tax rule templates have no parent-child hierarchy — they are flat records with child `lines`.
  operationId: searchTaxRuleTemplates
  requestBody:
    description: Optional filter criteria; send `{}` to list all tax rule templates.
    content:
      application/json:
        schema:
          type: object
          $ref: '../../../api_doc.yaml#/components/schemas/Filter'
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    rec_name:
                      type: string
                    name:
                      type: string
                    kind:
                      type: string
                      enum: [sale, purchase, both]
                    account:
                      type: integer
              errors:
                type: object
                nullable: true
              pagination:
                type: object
                properties:
                  page:
                    type: integer
                  per_page:
                    type: integer
                  total_pages:
                    type: integer
                  total_records:
                    type: integer
              status:
                type: integer
              success_message:
                type: string
                nullable: true
          example:
            data:
              - id: 30
                rec_name: EU Intra-Community
                name: EU Intra-Community
                kind: sale
                account: 1
              - id: 31
                rec_name: Reverse Charge
                name: Reverse Charge
                kind: purchase
                account: 1
            errors: null
            pagination:
              page: 1
              per_page: 100
              total_pages: 1
              total_records: 2
            status: 200
            success_message: null
    '401':
      description: >-
        401 Unauthorized: The server could not verify that you are
        authorized to access the URL requested. You either supplied the
        wrong credentials (e.g. a bad password), or your browser doesn't
        understand how to supply the credentials required.
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'
