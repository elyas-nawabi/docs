schema:
  properties:
    data:
      type: object
      properties:
        childs:
          type: array
          description: Direct child template nodes (nested tree on list/search responses).
          items:
            type: object
            properties:
              id:
                type: integer
              rec_name:
                type: string
              childs:
                type: array
        closed:
          type: boolean
        code:
          type: string
          nullable: true
        credit_type:
          type: integer
          nullable: true
        credit_type_:
          $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
        debit_type:
          type: integer
          nullable: true
        debit_type_:
          $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
        deferral:
          type: boolean
        end_date:
          type: string
          format: date
          nullable: true
        general_ledger_balance:
          type: boolean
        id:
          type: integer
        name:
          type: string
        parent:
          type: integer
          nullable: true
        parent_:
          $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
        party_required:
          type: boolean
        rec_name:
          type: string
        reconcile:
          type: boolean
        replaced_by:
          type: integer
          nullable: true
        replaced_by_:
          $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
        start_date:
          type: string
          format: date
          nullable: true
        taxes:
          type: array
        type:
          type: integer
          nullable: true
        type_:
          $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
    errors:
      type: object
      nullable: true
    pagination:
      type: object
      nullable: true
    status:
      type: integer
    success_message:
      type: string
      nullable: true

