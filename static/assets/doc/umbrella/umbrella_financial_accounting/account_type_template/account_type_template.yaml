openapi: 3.1.0
servers:
  - url: 'http://api-alpha.umbrellaerp.com'
tags:
  - name: account type template
    description: |
      Global account-type blueprints (`account.account.type.template`). Account type templates are not tied to any company;
      they define the default account type hierarchy (name, statement category, boolean flags) installed with accounting modules.

      **Typical flow**
      1. `POST /account-type-templates/search` — list root type templates (each row includes a nested `childs` tree).
      2. `GET /account-type-templates/{obj_id}` — inspect one type template node (root or child).
      3. Materialize types for a company with `GET /financial-accounting/account-types/import-default-account-types-to-company/{company_id}`.

      Search is restricted to **root templates** (`parent` is null). Child nodes are returned inside `childs` on search/get responses.
paths:
  '/financial-accounting/account-type-templates/search':
    $ref: 'get_account_type_template.yaml'
  '/financial-accounting/account-type-templates':
    $ref: 'post_delete_account_type_template.yaml'
  '/financial-accounting/account-type-templates/{obj_id}':
    $ref: 'get_put_account_type_template_by_id.yaml'
