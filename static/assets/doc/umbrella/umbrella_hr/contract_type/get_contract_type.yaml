post:
  tags:
    - contract type
  summary: Get contract type details.
  description: Get contract type details.
  operationId: getContractTypes
  requestBody:
        description: If you wish to apply filtering, please set the criteria; otherwise, send an empty JSON request.
        content:
          application/json:
            schema:
              type: object
              $ref: '../../../api_doc.yaml#/components/schemas/Filter'
  responses:
    '200':
      description: List of contract types.
      content:
        application/json:
          schema:
              type: object
              properties:
                data:
                  type: array
                  properties:
                    create_date: 
                      type: string 
                      format: date 
                    create_uid: 
                      type: integer
                    create_uid_:
                      $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
                    code: 
                      type: string
                    country: 
                      type: integer
                    country_:
                      $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
                    id: 
                      type: integer
                    name: 
                      type: string
                    rec_name: 
                      type: string
                    sequence: 
                      type: integer
                    write_date:
                      type: string
                      format: date 
                    write_uid:
                      type: integer
                error:
                  type: object
                  nullable: true
                pagination:
                  type: object
                  properties:
                    page:
                      type: integer
                    per_page:
                      type: integer
                    total_pages:
                      type: integer
                    total_records:
                      type: integer
                status:
                  type: integer
                success_message:
                  type: string
                  nullable: true
          example:
            data:
              - code: '102'
                country: 1
                country_:
                  id: 1
                  name: Oman
                create_date: '2025-03-16T10:28:21.473496'
                create_uid: 1
                create_uid_:
                  id: 1
                  name: Administrator
                id: 1
                name: Full Time
                rec_name: Full Time
                sequence: 12
                write_date: 
                write_uid: 
            error: null
            pagination:
              page: 1
              per_page: 100
              total_pages: 1
              total_records: 1
            status: 200
            success_message: null
    '401':
      description: >-
        401 Unauthorized: The server could not verify that you are
        authorized to access the URL requested. You either supplied the
        wrong credentials (e.g. a bad password), or your browser doesn't
        understand how to supply the credentials required.
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'
