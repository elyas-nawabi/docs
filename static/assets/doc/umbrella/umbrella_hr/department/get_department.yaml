post:
  tags:
    - department
  summary: Get department details.
  description: Get department details.
  operationId: getDepartments
  requestBody:
        description: If you wish to apply filtering, please set the criteria; otherwise, send an empty JSON request.
        content:
          application/json:
            schema:
              type: object
              $ref: '../../../api_doc.yaml#/components/schemas/Filter'
  responses:
    '200':
      description: List of departments.
      content:
        application/json:
          schema:
              type: object
              properties:
                data:
                  type: array
                  properties:
                    create_date: 
                      type: string 
                      format: date 
                    create_uid: 
                      type: integer
                    create_uid_:
                      $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
                    active: true
                    company: 
                      type: integer
                    company_:
                      $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
                    id: 
                      type: integer
                    manager: 
                      type: integer
                    manager_:
                      $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
                    name: 
                      type: string
                    rec_name: 
                      type: string
                    total_employee: 
                      type: integer
                    write_date:
                      type: string
                      format: date 
                    write_uid:
                      type: integer
                error:
                  type: object
                  nullable: true
                pagination:
                  type: object
                  properties:
                    page:
                      type: integer
                    per_page:
                      type: integer
                    total_pages:
                      type: integer
                    total_records:
                      type: integer
                status:
                  type: integer
                success_message:
                  type: string
                  nullable: true
          example:
            data:
              - active: true
                company: 1
                company_:
                  id: 1
                  name: Milestone
                create_date: '2025-03-16T09:58:38.811536'
                create_uid: 1
                create_uid_:
                  id: 1
                  name: Administrator
                id: 2
                manager: 8
                manager_:
                  id: 8
                  name: Milestone
                name: IT
                rec_name: Technical / IT
                total_employee: 0
                write_date: 
                write_uid: 
            error: 
            pagination:
              page: 1
              per_page: 100
              total_pages: 1
              total_records: 2
            status: 200
            success_message: 

    
    '401':
      description: >-
        401 Unauthorized: The server could not verify that you are
        authorized to access the URL requested. You either supplied the
        wrong credentials (e.g. a bad password), or your browser doesn't
        understand how to supply the credentials required.
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'
