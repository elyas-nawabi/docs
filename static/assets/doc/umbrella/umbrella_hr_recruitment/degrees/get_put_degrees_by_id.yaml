get:
  tags:
    - degrees
  summary: Get one degrees.
  description: Get one degrees.
  operationId: getDegreesById
  parameters:
    - name: obj_id
      in: path
      required: true
      schema:
        type: integer
      example: 1
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: 'schema.yaml'
'401':
  description: >-
    401 Unauthorized: The server could not verify that you are
    authorized to access the URL requested. You either supplied the
    wrong credentials (e.g. a bad password), or your browser doesn't
    understand how to supply the credentials required.
  content:
    application/json:
      schema:
        $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'

    '404':
      description: 404 Not Found.
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP404'

put:
  tags:
    - degrees
  summary: Update degrees.
  description: Update degrees.
  operationId: updateDegreesById
  parameters:
    - name: obj_id
      in: path
      required: true
      schema:
        type: integer
      example: 1
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          $ref: 'schemas/create-degrees.yaml'
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: 'schema.yaml'
'401':
  description: >-
    401 Unauthorized: The server could not verify that you are
    authorized to access the URL requested. You either supplied the
    wrong credentials (e.g. a bad password), or your browser doesn't
    understand how to supply the credentials required.
  content:
    application/json:
      schema:
        $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'
