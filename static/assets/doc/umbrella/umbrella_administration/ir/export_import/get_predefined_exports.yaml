get:
  tags:
    - export import
  summary: Get predefined exports for a model
  description: Retrieve all predefined export configurations for a specific model
  operationId: getPredefinedExports
  parameters:
    - name: model
      required: true
      in: path
      description: The model name to get predefined exports for
      schema:
        type: string
      example: "account.invoice"
  responses:
    '200':
      description: List of predefined exports for the model
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    name:
                      type: string
                      description: Name of the export configuration
                    header:
                      type: boolean
                      description: Whether to include headers in export
                    records:
                      type: string
                    export_fields:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                          name:
                            type: string
                            description: Field name to export
              errors:
                type: object
                nullable: true
              status:
                type: integer
              success_message:
                type: string
                nullable: true
          example:
            data:
              - id: 1
                name: "Invoice Export"
                header: true
                records: "listed"
                export_fields:
                  - id: 1
                  - name: "number"
                  - name: "party.name"
                  - name: "invoice_date"
                  - name: "total_amount"
            errors: null
            status: 200
            success_message: null
    '401':
      description: >-
        401 Unauthorized: The server could not verify that you are
        authorized to access the URL requested. You either supplied the
        wrong credentials (e.g. a bad password), or your browser doesn't
        understand how to supply the credentials required.
      content:
        application/json:
          schema:
            $ref: '../../../../api_doc.yaml#/components/schemas/HTTP401' 