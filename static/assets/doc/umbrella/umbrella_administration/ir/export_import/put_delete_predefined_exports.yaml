                type: object
                nullable: true
              status:
                type: integer
              success_message:
                type: string
                nullable: true
          example:
            data: null
            errors: null
            status: 200
            success_message: "Export configuration deleted successfully"
    '404':
      description: Export configuration not found
      content:
        application/json:
          schema:
