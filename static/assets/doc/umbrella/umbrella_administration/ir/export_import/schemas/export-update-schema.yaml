type: object
properties:
  name:
    type: string
    description: Name of the export configuration
    example: "Updated Invoice Export"
  header:
    type: boolean
    description: Whether to include headers in the export
    example: true
  export_fields:
    type: array
    description: List of fields to export
    items:
      type: object
      properties:
        name:
          type: string
          description: Field name to export (can include related fields with dot notation)
          example: "party.name"
  records:
    type: string
    example: "listed"

example:
  name: "Updated Customer Invoice Export"
  header: true
  export_fields:
    - name: "number"
    - name: "party.name"
    - name: "invoice_date"
    - name: "total_amount"
    - name: "state"
    - name: "currency.code"
  records: "all" 