type: object
properties:
  fields_names:
    type: array
    description: List of field names to export
    items:
      type: string
    example: ["number", "party.name", "invoice_date", "total_amount"]
  domain:
    type: array
    description: Domain filter criteria for selecting records to export
    items:
      type: array
    example: [["state", "=", "posted"], ["invoice_date", ">=", "2024-01-01"]]
  limit:
    type: integer
    example: 100
  offset:
    type: integer
    example: 100
  order:
    type: list
    example: [["name", "ASC"]]
  header:
    type: boolean
    description: Whether to include field headers as first row
    default: false
    example: true

required:
  - fields_names

example:
  fields_names: ["name", "email", "phone",]
  domain: [["state", "=", "posted"], ["invoice_date", ">=", "2024-01-01"]]
  offset: 0
  limit: 100
  order: [["name", "ASC"]] 
  header: true