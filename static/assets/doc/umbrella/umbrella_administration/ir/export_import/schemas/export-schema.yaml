type: object
properties:
  name:
    type: string
    description: Name of the export configuration
    example: "Invoice Export"
  resource:
    type: string
    description: Model name to export from
    example: "account.invoice"
  header:
    type: boolean
    description: Whether to include headers in the export
    example: true
  export_fields:
    type: array
    description: List of fields to export
    items:
      type: object
      properties:
        name:
          type: string
          description: Field name to export (can include related fields with dot notation)
          example: "party.name"
  records:
    type: string
    example: "listed"

required:
  - name
  - resource
  - export_fields

example:
  name: "Customer Invoice Export"
  resource: "account.invoice"
  header: true
  export_fields:
    - name: "number"
    - name: "party.name"
    - name: "invoice_date"
    - name: "total_amount"
    - name: "state"
  records: "listed" 