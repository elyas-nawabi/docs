    post:
      tags:
        - user
      summary: Get user details.
      description: Get user details.
      operationId: getUsers
      requestBody:
        description: If you wish to apply filtering, please set the criteria; otherwise, send an empty JSON request.
        content:
          application/json:
            schema:
              type: object
              $ref: '../../../../api_doc.yaml#/components/schemas/Filter'
      responses:
        '200':
          description: List of users.
          content:
            application/json:
              schema:
                type: array
                properties:
                  create_date: 
                    type: string 
                    format: date 
                  create_uid: 
                    type: integer
                  create_uid_:
                    $ref: '../../../../api_doc.yaml#/components/schemas/CommonType'
                  avatar: 
                    type: string
                  avatar_url: 
                    type: string
                  id: 
                    type: integer
                  login: 
                    type: string
                  name: 
                    type: string
                  rec_name: 
                    type: string
                  sessions: 
                    type: integer
                  write_date:
                    type: string
                    format: date 
                  write_uid:
                    type: integer
                  write_uid_:
                    $ref: '../../../../api_doc.yaml#/components/schemas/CommonType'
              example:
                - avatar: ""
                  avatar_url: "/avatar/dW1icmVsbGE%3D/1692fe33918d4609817707f4591e7073"
                  create_date: '2024-06-24T12:36:08.706972'
                  create_uid: 0
                  create_uid_:
                    id: 0
                    name: Root
                  id: 1
                  login: admin
                  name: Administrator
                  rec_name: Administrator
                  sessions: 8
                  write_date: '2024-06-25T04:26:12.287590'
                  write_uid: 1
                  write_uid_:
                    id: 1
                    name: Administrator
                
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../../../api_doc.yaml#/components/schemas/HTTP401'
    