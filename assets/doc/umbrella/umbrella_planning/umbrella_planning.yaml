          content:
            application/json:
              schema:
                $ref: '../../api_doc.yaml#/components/schemas/HTTP404'

components:
  schemas:
    PlanningRoleUpsertRequest:
      type: object
      properties:
        name:
          type: string
        sequence:
          type: integer
        active:
          type: boolean
        linked_resources:
          type: array
          items:
            type: integer
      required:
        - name
      example:
        name: "Shift Leader"
        sequence: 10
        active: true
        linked_resources: [12, 18]

    PlanningRoleResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            sequence:
              type: integer
            active:
              type: boolean
            linked_resources:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
            create_date:
              type: string
              format: date-time
            create_uid:
              type: integer
            write_date:
              type: string
              format: date-time
              nullable: true
            write_uid:
              type: integer
              nullable: true
        error:
          type: object
          nullable: true
        pagination:
          type: object
          nullable: true
        status:
          type: integer
        success_message:
          type: string
          nullable: true
      example:
        data:
          id: 1
          name: "Shift Leader"
          sequence: 10
          active: true
          linked_resources:
            - id: 12
              name: "John Doe"
        error: null
        pagination: null
        status: 200
        success_message: null

    PlanningSlotUpsertRequest:
      type: object
      properties:
        resource:
          type: integer
        company:
          type: integer
        role:
          type: integer
        start_datetime:
          type: string
          format: date-time
        end_datetime:
          type: string
          format: date-time
        allocated_percentage:
          type: number
        note:
          type: string
      required:
        - resource
        - start_datetime
        - end_datetime
      example:
        resource: 12
        company: 1
        role: 1
        start_datetime: "2026-04-15T09:00:00Z"
        end_datetime: "2026-04-15T17:00:00Z"
        allocated_percentage: 100
        note: "Morning shift"

    PlanningSlotResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: integer
            resource:
              type: integer
            employee:
              type: integer
              nullable: true
            company:
              type: integer
              nullable: true
            department:
              type: integer
              nullable: true
            role:
              type: integer
              nullable: true
            start_datetime:
              type: string
              format: date-time
            end_datetime:
              type: string
              format: date-time
            allocated_percentage:
              type: number
            duration:
              type: number
              nullable: true
            allocated_hours:
              type: number
              nullable: true
            state:
              type: string
              enum: [draft, published]
            note:
              type: string
            create_date:
              type: string
              format: date-time
            create_uid:
              type: integer
            write_date:
              type: string
              format: date-time
              nullable: true
            write_uid:
              type: integer
              nullable: true
        error:
          type: object
          nullable: true
        pagination:
          type: object
          nullable: true
        status:
          type: integer
        success_message:
          type: string
          nullable: true
      example:
        data:
          id: 5
          resource: 12
          employee: 7
          company: 1
          department: 3
          role: 1
          start_datetime: "2026-04-15T09:00:00Z"
          end_datetime: "2026-04-15T17:00:00Z"
          allocated_percentage: 100
          duration: 8
          allocated_hours: 8
          state: "draft"
          note: "Morning shift"
        error: null
        pagination: null
        status: 200
        success_message: null
