            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../api_doc.yaml#/components/schemas/HTTP401'

  '/planning/planning-slots':
    post:
      tags:
        - umbrella_planning
      summary: Create planning slot
      description: Create a new planning slot.
      operationId: createPlanningSlot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanningSlotUpsertRequest'
      responses:
        '201':
          description: Created
