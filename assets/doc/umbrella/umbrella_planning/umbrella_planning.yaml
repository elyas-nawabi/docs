  '/planning/planning-slots/{obj_id}/draft':
    post:
      tags:
        - umbrella_planning
      summary: Set planning slot to draft
      description: Change planning slot state from `published` to `draft`.
      operationId: draftPlanningSlotById
      parameters:
        - name: obj_id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
