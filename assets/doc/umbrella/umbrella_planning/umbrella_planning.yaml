openapi: 3.1.0
servers:
  - url: 'http://api-alpha.umbrellaerp.com'
tags:
  - name: umbrella_planning
    description: >
      Planning module APIs for managing planning roles and planning slots.

      Includes CRUD/search endpoints and planning slot workflow actions.
paths:
  '/planning/planning-roles/search':
    post:
      tags:
        - umbrella_planning
      summary: Search planning roles
      description: Search planning roles with optional filter criteria.
      operationId: searchPlanningRoles
      requestBody:
        description: >
          If you wish to apply filtering, please set the criteria;
          otherwise, send an empty JSON request.
        content:
          application/json:
            schema:
              $ref: '../../api_doc.yaml#/components/schemas/Filter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanningRoleResponse'
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../api_doc.yaml#/components/schemas/HTTP401'

  '/planning/planning-roles':
    post:
      tags:
        - umbrella_planning
      summary: Create planning role
