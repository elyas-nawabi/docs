  '/planning/planning-slots/{obj_id}':
    get:
      tags:
        - umbrella_planning
      summary: Get planning slot by ID
      description: Get one planning slot by ID.
      operationId: getPlanningSlotById
      parameters:
        - name: obj_id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanningSlotResponse'
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
