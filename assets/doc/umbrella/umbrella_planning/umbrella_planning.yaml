    put:
      tags:
        - umbrella_planning
      summary: Update planning slot
      description: Update planning slot by ID.
      operationId: updatePlanningSlotById
      parameters:
        - name: obj_id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanningSlotUpsertRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanningSlotResponse'
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../api_doc.yaml#/components/schemas/HTTP401'

  '/planning/planning-slots/{obj_id}/publish':
    post:
      tags:
        - umbrella_planning
      summary: Publish planning slot
      description: Change planning slot state from `draft` to `published`.
      operationId: publishPlanningSlotById
      parameters:
        - name: obj_id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../../api_doc.yaml#/components/schemas/HTTP200'
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
