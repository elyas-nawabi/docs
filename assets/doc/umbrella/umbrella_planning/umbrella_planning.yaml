    delete:
      tags:
        - umbrella_planning
      summary: Delete planning slots
      description: Delete planning slots by IDs.
      operationId: deletePlanningSlots
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../api_doc.yaml#/components/schemas/DeleteRequestBody'
      responses:
        '200':
          description: OK
          content:
