          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanningRoleResponse'
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../api_doc.yaml#/components/schemas/HTTP401'
    delete:
      tags:
        - umbrella_planning
      summary: Delete planning roles
      description: Delete planning roles by IDs.
      operationId: deletePlanningRoles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '../../api_doc.yaml#/components/schemas/DeleteRequestBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../../api_doc.yaml#/components/schemas/DeleteApiResponse'
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../api_doc.yaml#/components/schemas/HTTP401'

  '/planning/planning-roles/{obj_id}':
    get:
      tags:
        - umbrella_planning
      summary: Get planning role by ID
      description: Get one planning role by ID.
      operationId: getPlanningRoleById
      parameters:
        - name: obj_id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanningRoleResponse'
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../api_doc.yaml#/components/schemas/HTTP401'
        '404':
          description: 404 Not Found.
          content:
            application/json:
              schema:
                $ref: '../../api_doc.yaml#/components/schemas/HTTP404'
    put:
      tags:
        - umbrella_planning
      summary: Update planning role
      description: Update planning role by ID.
      operationId: updatePlanningRoleById
      parameters:
        - name: obj_id
          in: path
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlanningRoleUpsertRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanningRoleResponse'
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../api_doc.yaml#/components/schemas/HTTP401'

  '/planning/planning-slots/search':
    post:
      tags:
        - umbrella_planning
      summary: Search planning slots
      description: Search planning slots with optional filter criteria.
      operationId: searchPlanningSlots
      requestBody:
        description: >
          If you wish to apply filtering, please set the criteria;
          otherwise, send an empty JSON request.
        content:
          application/json:
            schema:
              $ref: '../../api_doc.yaml#/components/schemas/Filter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlanningSlotResponse'
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
