delete:
      tags:
        - wizard
      summary: Delete Wizard Session.
      description: Delete Wizard Session.
      operationId: deleteWizardSession
      parameters:
        - name: wizard
          in: path
          schema:
            type: string
          rquired: true
          example: account.fiscalyear.renew
        - name: session_id
          in: path
          schema:
            type: integer
          rquired: true
          example: 19
        
      requestBody:
        content:
          application/json:
            schema:
              type: object
              $ref: '../../../api_doc.yaml#/components/schemas/DeleteRequestBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../../../api_doc.yaml#/components/schemas/DeleteApiResponse'
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'
  