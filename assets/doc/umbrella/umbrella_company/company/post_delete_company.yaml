post:
      tags:
        - company
      summary: Create a company.
      description: Create a company.
      operationId: postCompanyById
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              $ref: 'schemas/create-company.yaml'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: 'schema.yaml'
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
