    get:
      tags:
        - employee
      summary: Get employee details.
      description: Get employee details.
      operationId: getEmployees
      responses:
        '200':
          description: List of employees.
          content:
            application/json:
              schema:
                  type: object
                  properties:
                    data:
                      type: array
                      properties:
                        id:
                          type: integer
                        party:
                          type: string
                        party_:
                          type: object
                          properties:
                            label:
                              type: string
                            value: 
                              type: integer
                    errors:
                      type: object
                    pagination:
                      type: object
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_pages:
                        type: integer
                      total_records:
                        type: integer
                    status:
                      type: integer
                    success_message:
                      type: string
                      nullable: true
              example:
                data:
                - id: 5
                  party: 1
                  party_:
                    label: Party 1
                    value: 1
                error: null
                pagination:
                  page: 1
                  per_page: 100
                  total_pages: 1
                  total_records: 9
                status: 200
                success_message: null
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'
    post:
      tags:
        - employee
      summary: Create a employee.
      description: Create a employee.
      operationId: postEmployeeById
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              $ref: '../../../api_doc.yaml#/components/schemas/CreateEmployee'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                    properties:
                      data:
                        company:
                          type: integer
                        end_date:
                          type: string
                          format: date
                        party:
                          type: integer
                        start_date:
                          type: string
                          format: date
                        supervisor:
                          type: integer
                      errors:
                        type: object
                        nullable: true
                      pagination:
                        type: object
                        nullable: true
                      status:
                        type: integer
                      success_message:
                        type: string
                        nullable: true

              required:
                - party
                - company
              example:
                data:
                  company: 2
                  end_date: '2024-02-13'
                  party: 1
                  start_date: '2024-02-01'
                  supervisor: 5
                error: null
                pagination: null
                status: 200
                success_message: null
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'
