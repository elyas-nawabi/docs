    post:
      tags:
        - employee
      summary: Get employee details.
      description: Get employee details.
      operationId: getEmployees
      requestBody:
        description: If you wish to apply filtering, please set the criteria; otherwise, send an empty JSON request.
        content:
          application/json:
            schema:
              type: object
              $ref: '../../../api_doc.yaml#/components/schemas/Filter'
      responses:
        '200':
          description: List of employees.
          content:
            application/json:
              schema:
                  type: object
                  properties:
                    data:
                      type: array
                      properties:
                        company: 
                          type: integer
                        company_:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                        end_date:
                          type: string
                          format: date
                        id:
                          type: integer
                        party:
                          type: string
                        party_:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                        rec_name:
                          type: string
                        start_date: 
                          type: string
                          format: date
                        supervisor:
                          type: integer
                        supervisor_:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                    errors:
                      type: object
                    pagination:
                      type: object
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_pages:
                        type: integer
                      total_records:
                        type: integer
                    status:
                      type: integer
                    success_message:
                      type: string
                      nullable: true
              example:
                data:
                - company: 2
                  company_:
                    id: 2
                    name: Party 1
                  end_date: '2024-02-13'
                  id: 5
                  party: 1
                  party_:
                    id: 1
                    name: Party 1
                  rec_name: Party 1
                  start_date: '2024-02-01'
                  supervisor: 5
                  supervisor_:
                    id: 5
                    name: Party 1
                error: null
                pagination:
                  page: 1
                  per_page: 100
                  total_pages: 1
                  total_records: 9
                status: 200
                success_message: null
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'
    
    