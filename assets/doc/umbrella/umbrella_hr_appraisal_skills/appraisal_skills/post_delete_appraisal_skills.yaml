post:
  tags:
    - appraisal_skills
  summary: Create an appraisal skill line.
  description: Attach a skill with level and optional justification to an appraisal.
  operationId: createAppraisalSkill
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          $ref: 'schemas/create-appraisal-skills.yaml'
  responses:
    '201':
      description: Created.
      content:
        application/json:
          schema:
            $ref: 'schema.yaml'
    '401':
      description: >-
        401 Unauthorized: The server could not verify that you are
        authorized to access the URL requested.
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'

delete:
  tags:
    - appraisal_skills
  summary: Delete appraisal skill lines.
  description: Delete one or more appraisal skill lines by id.
  operationId: deleteAppraisalSkills
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          $ref: '../../../api_doc.yaml#/components/schemas/DeleteRequestBody'
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/DeleteApiResponse'
    '401':
      description: >-
        401 Unauthorized: The server could not verify that you are
        authorized to access the URL requested.
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'
