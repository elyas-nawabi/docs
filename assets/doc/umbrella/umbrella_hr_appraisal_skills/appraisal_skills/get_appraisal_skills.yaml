post:
  tags:
    - appraisal_skills
  summary: Search appraisal skills.
  description: Returns a filtered list of appraisal skill lines.
  operationId: searchAppraisalSkills
  requestBody:
    description: If you wish to apply filtering, please set the criteria; otherwise, send an empty JSON request.
    content:
      application/json:
        schema:
          type: object
          $ref: '../../../api_doc.yaml#/components/schemas/Filter'
  responses:
    '200':
      description: List of appraisal skill lines.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    rec_name:
                      type: string
                    appraisal:
                      type: integer
                    appraisal_:
                      $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
                    skill_type:
                      type: integer
                    skill_type_:
                      $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
                    skill:
                      type: integer
                    skill_:
                      $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
                    skill_level:
                      type: integer
                    skill_level_:
                      $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
                    justification:
                      type: string
                      nullable: true
                    create_date:
                      type: string
                      format: date-time
                    create_uid:
                      type: integer
                    create_uid_:
                      $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
                    write_date:
                      type: string
                      format: date-time
                      nullable: true
                    write_uid:
                      type: integer
                      nullable: true
              error:
                type: object
                nullable: true
              pagination:
                type: object
                nullable: true
              status:
                type: integer
              success_message:
                type: string
                nullable: true
    '401':
      description: >-
        401 Unauthorized: The server could not verify that you are
        authorized to access the URL requested.
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'
