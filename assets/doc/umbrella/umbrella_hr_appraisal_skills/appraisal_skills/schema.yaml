schema:
  properties:
    data:
      type: object
      properties:
        id:
          type: integer
        rec_name:
          type: string
        appraisal:
          type: integer
        appraisal_:
          $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
        skill_type:
          type: integer
        skill_type_:
          $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
        skill:
          type: integer
        skill_:
          $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
        skill_level:
          type: integer
        skill_level_:
          $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
        justification:
          type: string
          nullable: true
        create_date:
          type: string
          format: date-time
        create_uid:
          type: integer
        create_uid_:
          $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
        write_date:
          type: string
          format: date-time
          nullable: true
        write_uid:
          type: integer
          nullable: true
    error:
      type: object
      nullable: true
    pagination:
      type: object
      nullable: true
    status:
      type: integer
    success_message:
      type: string
      nullable: true

example:
  data:
    id: 1
    rec_name: Python / Advanced
    appraisal: 1
    appraisal_:
      id: 1
      name: Jane Smith
    skill_type: 2
    skill_type_:
      id: 2
      name: Technical
    skill: 10
    skill_:
      id: 10
      name: Python
    skill_level: 4
    skill_level_:
      id: 4
      name: Advanced
    justification: 'Led two cross-team initiatives.'
    create_date: '2026-04-01T10:00:00'
    create_uid: 1
    create_uid_:
      id: 1
      name: Administrator
    write_date: null
    write_uid: null
  error: null
  pagination: null
  status: 200
  success_message: null
