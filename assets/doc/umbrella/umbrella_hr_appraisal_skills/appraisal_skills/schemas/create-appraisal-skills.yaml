type: object
description: Body for create/update appraisal skill line.
properties:
  appraisal:
    type: integer
    description: Appraisal id (`hr.appraisal`).
  skill_type:
    type: integer
    description: Skill type id (`hr.skill.type`).
  skill:
    type: integer
    description: Skill id (`hr.skill`).
  skill_level:
    type: integer
    description: Skill level id (`hr.skill.level`).
  justification:
    type: string
    nullable: true
    description: Optional rationale for the assessed level.

example:
  appraisal: 1
  skill_type: 2
  skill: 10
  skill_level: 4
  justification: 'Led two cross-team initiatives using this skill.'
