                    name: Root
                  digits: 2
                  factor: 100
                  id: 27
                  name: Are
                  rate: 0.01
                  rec_name: Are
                  rounding: 0.01
                  symbol: a
                  write_date: null
                  write_uid: null
                  write_uid_: {}
                errors: null
                pagination: null
                status: 200
                success_message: null
