                          type: integer
                        factor: 
                          type: integer
                        id: 
                          type: integer
                        name: 
                          type: string
                        rate: 
                          type: number
                          format: decimal
                        rec_name: 
                          type: string
                        rounding: 
                          type: number
                          format: decimal
                        symbol: 
                          type: string
                        write_date: 
                          type: string
                          format: date
                        write_uid: 
                          type: integer
                        write_uid_:
                          $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
                    errors:
                      type: object
                    pagination:
                      properties:
                        page:
                          type: integer
                        per_page:
                          type: integer
                        total_pages:
                          type: integer
                        total_records:
                          type: integer
                    status:
                      type: integer
                    success_message:
                      type: string
              example:
                data:
                  active: true
                  category: 6
                  category_:
                    id: 6
                    name: Surface
                  create_date: '2024-04-18T04:43:18.098749'
                  create_uid: 0
                  create_uid_:
