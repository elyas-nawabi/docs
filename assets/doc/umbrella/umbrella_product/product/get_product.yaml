                  rec_name: Medicine
                  type: goods
                  write_date: 
                  write_uid: 
                  write_uid_: {}
                errors: null
                pagination:
                  page: 1
                  per_page: 100
                  total_pages: 1
                  total_records: 12
                status: 200
                success_message: null
