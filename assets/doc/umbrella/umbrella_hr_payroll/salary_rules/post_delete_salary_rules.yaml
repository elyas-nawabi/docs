post:
  tags:
    - salary_rules
  summary: Create Salary Rules.
  description: Create Salary Rules.
  operationId: createSalaryrules
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: 'schemas/create-salary-rules.yaml'
  responses:
    '201':
      description: Created
      content:
        application/json:
          schema:
            $ref: 'schema.yaml'
    '401':
      description: Unauthorized.
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'


delete:
  tags:
    - salary_rules
  summary: Delete Salary Rules.
  description: Delete one or more Salary Rules by id.
  operationId: deleteSalaryrules
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            ids:
              type: array
              items:
                type: integer
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP200'
    '401':
      description: Unauthorized.
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'

