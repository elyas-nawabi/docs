post:
  tags:
    - payslip_input_types
  summary: Create Payslip Input Types.
  description: Create Payslip Input Types.
  operationId: createPayslipinputtypes
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: 'schemas/create-payslip-input-types.yaml'
  responses:
    '201':
      description: Created
      content:
        application/json:
          schema:
            $ref: 'schema.yaml'
    '401':
      description: Unauthorized.
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'


delete:
  tags:
    - payslip_input_types
  summary: Delete Payslip Input Types.
  description: Delete one or more Payslip Input Types by id.
  operationId: deletePayslipinputtypes
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            ids:
              type: array
              items:
                type: integer
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP200'
    '401':
      description: Unauthorized.
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'

