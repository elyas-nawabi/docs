post:
  tags:
    - payslips
  summary: Create Payslips.
  description: Create Payslips.
  operationId: createPayslips
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: 'schemas/create-payslips.yaml'
  responses:
    '201':
      description: Created
      content:
        application/json:
          schema:
            $ref: 'schema.yaml'
    '401':
      description: Unauthorized.
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'


delete:
  tags:
    - payslips
  summary: Delete Payslips.
  description: Delete one or more Payslips by id.
  operationId: deletePayslips
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            ids:
              type: array
              items:
                type: integer
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP200'
    '401':
      description: Unauthorized.
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'

