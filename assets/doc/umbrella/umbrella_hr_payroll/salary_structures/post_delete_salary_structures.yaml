post:
  tags:
    - salary_structures
  summary: Create Salary Structures.
  description: Create Salary Structures.
  operationId: createSalarystructures
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: 'schemas/create-salary-structures.yaml'
  responses:
    '201':
      description: Created
      content:
        application/json:
          schema:
            $ref: 'schema.yaml'
    '401':
      description: Unauthorized.
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'


delete:
  tags:
    - salary_structures
  summary: Delete Salary Structures.
  description: Delete one or more Salary Structures by id.
  operationId: deleteSalarystructures
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            ids:
              type: array
              items:
                type: integer
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP200'
    '401':
      description: Unauthorized.
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'

