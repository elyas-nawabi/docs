post:
  tags:
    - rule_parameters
  summary: Create Rule Parameters.
  description: Create Rule Parameters.
  operationId: createRuleparameters
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: 'schemas/create-rule-parameters.yaml'
  responses:
    '201':
      description: Created
      content:
        application/json:
          schema:
            $ref: 'schema.yaml'
    '401':
      description: Unauthorized.
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'


delete:
  tags:
    - rule_parameters
  summary: Delete Rule Parameters.
  description: Delete one or more Rule Parameters by id.
  operationId: deleteRuleparameters
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          properties:
            ids:
              type: array
              items:
                type: integer
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP200'
    '401':
      description: Unauthorized.
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'

