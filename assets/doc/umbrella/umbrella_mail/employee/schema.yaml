schema:
  properties:
    id:
      type: integer
      description: Unique identifier for the employee
    party:
      type: integer
      description: ID of the party record
    company:
      type: integer
      description: ID of the company the employee belongs to
    start_date:
      type: string
      format: date
      description: Employee start date
    end_date:
      type: string
      format: date
      nullable: true
      description: Employee end date
    supervisor:
      type: integer
      nullable: true
      description: ID of the supervisor
    categories:
      type: array
      description: List of employee categories
      items:
        type: object
        properties:
          id:
            type: integer
          name:
            type: string
    user:
      type: integer
      nullable: true
      description: ID of the user account
    job_title:
      type: string
      description: Job title of the employee
    mobile_phone:
      type: string
      description: Mobile phone number
    work_email:
      type: string
      description: Work email address
    first_contract_date:
      type: string
      format: date
      nullable: true
      description: Date of first contract
    party_name:
      type: string
      description: Name of the employee
    active:
      type: boolean
      description: Whether the employee is active
    department:
      type: integer
      nullable: true
      description: ID of the department
    private_street:
      type: string
      description: Private street address
    private_street2:
      type: string
      description: Private street address line 2
    private_city:
      type: string
      description: Private city
    private_zip:
      type: string
      description: Private zip code
    private_country:
      type: integer
      nullable: true
      description: ID of private country
    private_phone:
      type: string
      description: Private phone number
    private_email:
      type: string
      description: Private email address
    country:
      type: integer
      nullable: true
      description: ID of the country
    gender:
      type: string
      description: Gender of the employee
    marital:
      type: string
      description: Marital status
    spouse_complete_name:
      type: string
      description: Spouse's complete name
    spouse_birthdate:
      type: string
      format: date
      nullable: true
      description: Spouse's birth date
    children:
      type: integer
      nullable: true
      description: Number of children
    place_of_birth:
      type: string
      description: Place of birth
    country_of_birth:
      type: integer
      nullable: true
      description: ID of country of birth
    birthday:
      type: string
      format: date
      nullable: true
      description: Employee's birth date
    ssnid:
      type: string
      description: Social Security Number ID
    sinid:
      type: string
      description: Social Insurance Number ID
    identification_id:
      type: string
      description: Identification ID
    passport_id:
      type: string
      description: Passport ID
    permit_no:
      type: string
      description: Permit number
    visa_no:
      type: string
      description: Visa number
    visa_expire:
      type: string
      format: date
      nullable: true
      description: Visa expiration date
    work_permit_expiration_date:
      type: string
      format: date
      nullable: true
      description: Work permit expiration date
    has_work_permit:
      type: string
      description: Work permit status
    work_permit_scheduled_activity:
      type: boolean
      description: Whether work permit has scheduled activity
    work_permit_name:
      type: string
      description: Work permit name
    additional_note:
      type: string
      description: Additional notes
    certificate:
      type: string
      description: Certificate information
    study_field:
      type: string
      description: Field of study
    study_school:
      type: string
      description: School of study
    emergency_contact:
      type: string
      description: Emergency contact name
    emergency_phone:
      type: string
      description: Emergency contact phone
    distance_home_work:
      type: integer
      nullable: true
      description: Distance from home to work
    km_home_work:
      type: integer
      nullable: true
      description: Distance in kilometers from home to work
    distance_home_work_unit:
      type: string
      description: Unit for distance measurement
    employee_type:
      type: string
      description: Type of employee
    notes:
      type: string
      description: General notes
    barcode:
      type: string
      description: Employee barcode
    pin:
      type: string
      description: Employee PIN
    departure_reason:
      type: integer
      nullable: true
      description: ID of departure reason
    departure_description:
      type: string
      description: Description of departure
    departure_date:
      type: string
      format: date
      nullable: true
      description: Date of departure
    id_card:
      type: string
      description: ID card data
    driving_license:
      type: string
      description: Driving license data
    private_car_plate:
      type: string
      description: Private car license plate
    job:
      type: integer
      nullable: true
      description: ID of the job position
    address:
      type: integer
      nullable: true
      description: ID of the address record
    address_description:
      type: string
      description: Description of the address
    work_phone:
      type: string
      description: Work phone number
    work_location:
      type: integer
      nullable: true
      description: ID of the work location
    work_location_name:
      type: string
      description: Name of the work location
    work_location_type:
      type: string
      description: Type of work location
    parent:
      type: integer
      nullable: true
      description: ID of the parent employee
    coach:
      type: integer
      nullable: true
      description: ID of the coach
    tz:
      type: string
      description: Timezone
    newly_hired:
      type: boolean
      description: Whether the employee is newly hired
    vehicle:
      type: string
      description: Vehicle information
    contracts:
      type: array
      description: List of contract IDs
      items:
        type: integer
    contract:
      type: integer
      nullable: true
      description: Current contract ID
    contracts_count:
      type: integer
      nullable: true
      description: Total number of contracts
    contract_warning:
      type: boolean
      description: Whether there's a contract warning
    attendance_manager:
      type: integer
      nullable: true
      description: ID of the attendance manager
    attendances:
      type: array
      description: List of attendance IDs
      items:
        type: integer
    last_attendance:
      type: integer
      nullable: true
      description: ID of the last attendance
    last_check_in:
      type: string
      format: date-time
      nullable: true
      description: Last check-in time
    last_check_out:
      type: string
      format: date-time
      nullable: true
      description: Last check-out time
    attendance_state:
      type: string
      description: Current attendance state
    hours_last_month:
      type: number
      format: decimal
      nullable: true
      description: Hours worked last month
    hours_today:
      type: number
      format: decimal
      nullable: true
      description: Hours worked today
    hours_previously_today:
      type: number
      format: decimal
      nullable: true
      description: Hours worked previously today
    last_attendance_worked_hours:
      type: number
      format: decimal
      nullable: true
      description: Hours worked in last attendance
    overtimes:
      type: array
      description: List of overtime IDs
      items:
        type: integer
    total_overtime:
      type: number
      format: decimal
      nullable: true
      description: Total overtime hours
    candidates:
      type: array
      description: List of candidate records
      items:
        type: object
        properties:
          id:
            type: integer
          name:
            type: string
    resume_lines:
      type: array
      description: List of resume line records
      items:
        type: object
        properties:
          id:
            type: integer
          name:
            type: string
    employee_skills:
      type: array
      description: List of employee skill records
      items:
        type: object
        properties:
          id:
            type: integer
          name:
            type: string

