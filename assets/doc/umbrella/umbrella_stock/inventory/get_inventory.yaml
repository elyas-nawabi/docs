    post:
      tags:
        - inventory
      summary: Get inventory details.
      description: Get inventory details.
      operationId: getInventory
      requestBody:
        description: If you wish to apply filtering, please set the criteria; otherwise, send an empty JSON request.
        content:
          application/json:
            schema:
              type: object
              $ref: '../../../api_doc.yaml#/components/schemas/Filter'
      responses:
        '200':
          description: List of inventory.
          content:
            application/json:
              schema:
                  type: object
                  properties:
                    data:
                      type: array
                      properties:
                        create_date: 
                          type: string 
                          format: date 
                        create_uid: 
                          type: integer
                        create_uid_:
                          $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
                        company: 
                          type: integer
                        company_:
                          $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
                        date: 
                          type: string
                          format: date
                        id: 
                          type: integer
                        location: 
                          type: integer
                        location_:
                          $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
                        number: 
                          type: string
                        rec_name:
                          type: string
                        state: 
                          type: string
                        write_date:
                          type: string
                          format: date 
                        write_uid:
                          type: integer
                        write_uid_:
                          $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
                    errors:
                      type: object
                    pagination:
                      type: object
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_pages:
                        type: integer
                      total_records:
                        type: integer
                    status:
                      type: integer
                    success_message:
                      type: string
                      nullable: true
              example:
                data:
                  - company: 1
                    company_:
                      id: 1
                      name: Milestone
                    create_date: '2024-08-10T15:27:34.721041'
                    create_uid: 1
                    create_uid_:
                      id: 1
                      name: Administrator
                    date: '2024-08-10'
                    id: 1
                    location: 2
                    location_:
                      id: 2
                      name: Output Zone
                    number: '1'
                    rec_name: "[1] Output Zone @ 08/10/2024"
                    state: draft
                    write_date: 
                    write_uid: 
                    write_uid_: {}

                error: null
                pagination:
                  page: 1
                  per_page: 100
                  total_pages: 1
                  total_records: 9
                status: 200
                success_message: null
        
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'
    
    