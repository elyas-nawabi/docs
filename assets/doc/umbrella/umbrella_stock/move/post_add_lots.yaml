post:
      tags:
        - move
      summary: Add lots.
      description: Add lots.
      operationId: postAddLotsById
      requestBody:
        required: true
        content:
          application/json:
            schema:
              product: 
                type: integer
              quantity: 
                type: integer
              unit: 
                type: integer
            required:
              - product 
              - quantity
              - unit
            example:
              product: 2
              quantity: 4
              unit: 1
              
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                data:
                  type: object
                  nullable: true
                errors:
                  type: object
                  nullable: true
                pagination:
                  type: object
                  nullable: true
                status:
                  type: integer
                success_message:
                  type: string
                  nullable: true
              example:
                errors: null
                pagination: null
                status: 200
                success_message: null
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'