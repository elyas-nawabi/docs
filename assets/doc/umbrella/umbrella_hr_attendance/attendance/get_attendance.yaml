post:
  tags:
    - attendance
  summary: Get attendance list.
  description: Get attendance list.
  operationId: getAttendances
  requestBody:
    description: If you wish to apply filtering, please set the criteria; otherwise, send an empty JSON request.
    content:
      application/json:
        schema:
          type: object
          $ref: '../../../api_doc.yaml#/components/schemas/Filter'
  responses:
    '200':
      description: List of attendances.
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    employee:
                      type: integer
                    employee_:
                      $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
                    check_in:
                      type: string
                      format: date-time
                    check_out:
                      type: string
                      format: date-time
                      nullable: true
                    worked_hours:
                      type: number
                    expected_hours:
                      type: number
                    overtime_hours:
                      type: number
                    validated_overtime_hours:
                      type: number
                    overtime_status:
                      type: string
                    in_mode:
                      type: string
                    in_city:
                      type: string
                    in_country_name:
                      type: string
                    in_latitude:
                      type: number
                    in_longitude:
                      type: number
                    out_mode:
                      type: string
                    out_city:
                      type: string
                    out_country_name:
                      type: string
                    out_latitude:
                      type: number
                    out_longitude:
                      type: number
                    create_date:
                      type: string
                      format: date-time
                    create_uid:
                      type: integer
                    create_uid_:
                      $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
                    write_date:
                      type: string
                      format: date-time
                      nullable: true
                    write_uid:
                      type: integer
                      nullable: true
              error:
                type: object
                nullable: true
              pagination:
                type: object
                nullable: true
              status:
                type: integer
              success_message:
                type: string
                nullable: true
          example:
            data:
              - id: 1
                employee: 5
                employee_:
                  id: 5
                  name: John Doe
                check_in: '2026-03-10T09:00:00'
                check_out: '2026-03-10T17:00:00'
                worked_hours: 8
                expected_hours: 8
                overtime_hours: 0
                validated_overtime_hours: 0
                overtime_status: none
                in_mode: kiosk
                in_city: Dubai
                in_country_name: United Arab Emirates
                in_latitude: 25.2048
                in_longitude: 55.2708
                out_mode: kiosk
                out_city: Dubai
                out_country_name: United Arab Emirates
                out_latitude: 25.2048
                out_longitude: 55.2708
                create_date: '2026-03-10T09:00:00'
                create_uid: 1
                create_uid_:
                  id: 1
                  name: Administrator
                write_date: null
                write_uid: null
            error: null
            pagination: null
            status: 200
            success_message: null
    '401':
      description: >-
        401 Unauthorized: The server could not verify that you are
        authorized to access the URL requested. You either supplied the
        wrong credentials (e.g. a bad password), or your browser doesn't
        understand how to supply the credentials required.
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'
