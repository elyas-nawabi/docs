post:
  tags:
    - WorkingSchedules
  summary: Search working schedules
  description: List of Working Schedules with filtering and pagination
  operationId: searchWorkingSchedules
  requestBody:
    required: true
    description: Search criteria and pagination
    content:
      application/json:
        schema:
          $ref: '../../../api_doc.yaml#/components/schemas/Filter'
  responses:
    '200':
      description: List of working schedules
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  $ref: 'schema.yaml#/schema'
              errors:
                type: object
                nullable: true
              pagination:
                type: object
                nullable: true
              status:
                type: integer
              success_message:
                type: string
                nullable: true
          example:
            data:
              - id: 1
                name: "Morning Shift"
                resource: 456
                start_date: "2024-01-20T08:00:00Z"
                end_date: "2024-01-20T12:00:00Z"
            errors: null
            pagination:
              page: 1
              per_page: 20
              total: 1
            status: 200
            success_message: null
    '401':
      description: >-
        401 Unauthorized: The server could not verify that you are
        authorized to access the URL requested. You either supplied the
        wrong credentials (e.g. a bad password), or your browser doesn't
        understand how to supply the credentials required.
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP401' 