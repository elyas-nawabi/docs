    post:
      tags:
        - sequence
      summary: Get sequence details.
      description: Get sequence details.
      operationId: getSequences
      requestBody:
        description: If you wish to apply filtering, please set the criteria; otherwise, send an empty JSON request.
        content:
          application/json:
            schema:
              type: object
              $ref: '../../../api_doc.yaml#/components/schemas/Filter'
      responses:
        '200':
          description: List of sequences.
          content:
            application/json:
              schema:
                  type: object
                  properties:
                    data:
                      type: array
                      properties:
                        company:
                          type: integer
                        company_:
                          type: object
                          properties:
                            id:
                              type: integer
                            name: 
                              type: string
                        id:
                          type: integer
                        name:
                          type: string
                        prefix:
                          type: string
                        rec_name:
                          type: string
                        sequence_type:
                          type: integer
                        sequence_type_:
                          type: object
                          properties:
                            id:
                              type: integer
                            name: 
                              type: string
                        suffix:
                          type: string
                        type:
                          type: string
                    errors:
                      type: object
                    pagination:
                      type: object
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_pages:
                        type: integer
                      total_records:
                        type: integer
                    status:
                      type: integer
                    success_message:
                      type: string
                      nullable: true
              example:
                data:
                - company: 1
                  company_:
                    id: 1
                    name: Party 1
                  id: 7
                  name: '2028'
                  prefix: ''
                  rec_name: '2028'
                  sequence_type: 3
                  sequence_type_:
                    id: 3
                    name: Account Move
                  suffix: ''
                  type: incremental
                error: null
                pagination:
                  page: 1
                  per_page: 100
                  total_pages: 1
                  total_records: 9
                status: 200
                success_message: null
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'
    