post:
      tags:
        - sequence
      summary: Create a sequence.
      description: Create a sequence.
      operationId: postSequenceById
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              $ref: '../../../api_doc.yaml#/components/schemas/CreateSequence'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                    properties:
                      data:
                        active:
                          type: boolean
                        company:
                          type: integer
                        company_:
                          id:
                            type: integer
                          name:
                            type: string
                        id:
                          type: integer
                        name:
                          type: string
                        number_increment:
                          type: integer
                        number_next:
                          type: integer
                        padding:
                          type: integer
                        prefix:
                          type: string
                        preview:
                          type: string
                        sequence_type:
                          type: integer
                        sequence_type_:
                          id:
                            type: integer
                          name:
                            type: string
                        suffix:
                          type: string
                        type:
                          type: string 
                      errors:
                        type: object
                        nullable: true
                      pagination:
                        type: object
                        nullable: true
                      status:
                        type: integer
                      success_message:
                        type: string
                        nullable: true

              required:
                - name
                - number_increment
                - number_next
                - padding
                - sequence_type
                - type 

              example:
                data:
                  active: true
                  company: 1
                  company_:
                    id: 1
                    name: 'Party 1'
                  id: 4
                  name: '2024'
                  number_increment: 1
                  number_next: 1
                  padding: 0
                  prefix: ''
                  preview: '1'
                  sequence_type: 3
                  sequence_type_:
                    id: 3
                    name: 'Account Move'
                  suffix: ''
                  type: 'incremental'
                error: null
                pagination: null
                status: 200
                success_message: null
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'

delete:
  tags:
    - sequence
  summary: Delete sequences.
  description: Delete sequences.
  operationId: deleteSequencesById
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          $ref: '../../../api_doc.yaml#/components/schemas/DeleteRequestBody'
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/DeleteApiResponse'
    '401':
      description: >-
        401 Unauthorized: The server could not verify that you are
        authorized to access the URL requested. You either supplied the
        wrong credentials (e.g. a bad password), or your browser doesn't
        understand how to supply the credentials required.
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'
