    get:
      tags:
        - ui menu
      summary: Get ui menu details.
      description: Get ui menu details.
      operationId: getUiMenus
      parameters:
        - name: obj_id
          in: path
          schema:
            type: integer
          rquired: true
          example: 1
      responses:
        '200':
          description: List of ui menus.
          content:
            application/json:
              schema:
                type: array
                properties:
                  create_date: 
                    type: string 
                    format: date 
                  create_uid: 
                    type: integer
                  create_uid_:
                    $ref: '../../../../api_doc.yaml#/components/schemas/CommonType'
                  complete_name: 
                    type: string
                  id: 
                    type: integer
                  rec_name: 
                    type: string
                  write_date:
                    type: string
                    format: date 
                  write_uid:
                    type: integer
                  write_uid_:
                    $ref: '../../../../api_doc.yaml#/components/schemas/CommonType'
              example:
                - complete_name: Party
                  create_date: '2024-06-25T04:23:54.754200'
                  create_uid: 0
                  create_uid_:
                    id: 0
                    name: Root
                  id: 61
                  rec_name: Party
                  write_date: '2024-08-30T06:27:57.936499'
                  write_uid: 0
                  write_uid_:
                    id: 0
                    name: Root
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../../../api_doc.yaml#/components/schemas/HTTP401'
    