                    type: string
                    format: date 
                  write_uid:
                    type: integer
                  write_uid_:
                    $ref: '../../../../api_doc.yaml#/components/schemas/CommonType'
              example:
                - create_date: '2024-06-24T12:35:58.699428'
                  create_uid: 0
                  create_uid_:
