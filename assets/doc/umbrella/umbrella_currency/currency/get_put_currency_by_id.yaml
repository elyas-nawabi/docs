get:
  tags:
    - currency
  summary: Get one currency.
  description: Get one currency.
  operationId: getCurrencyById
  parameters:
    - name: obj_id
      in: path
      schema:
        type: integer
      rquired: true
      example: 1
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
              type: object
              properties:
                data:
                  type: array
                  properties:
                    active:
                      type: boolean
                    cash_rounding: 
                      type: number
                      format: float
                    code:
                      type: string
                    digits:
                      type: integer
                    id:
                      type: integer
                    name:
                      type: string
                    numeric_code:
                      type: string
                    rate:
                      type: number
                      format: float
                    rates:
                      type: array
                      properties:
                        date: 
                          type: string
                          format: date
                        id: 
                          type: integer
                        rate: 
                          type: number
                          format: float
                    rec_name:
                      type: string
                    rounding:
                      type: number
                      format: float
                    symbol:
                      type: string
                errors:
                  type: object
                  nullable: true
                pagination:
                  type: object
                  nullable: true
                status:
                  type: integer
                success_message:
                  type: object
                  nullable: true
          example:
            data:
              active: true
              cash_rounding: null
              code: "AFN"
              digits: 2
              id: 1
              name: "Afghani"
              numeric_code: "001"
              rate: 0
              rates:
                - date: "2024-02-06"
                  id: 6
                  rate: 0.1
              rec_name: "2028"
              rounding: 0.01
              symbol: "AFN"
            errors: null
            pagination: null
            status: 200
            success_message: null
    '401':
      description: >-
        401 Unauthorized: The server could not verify that you are
        authorized to access the URL requested. You either supplied the
        wrong credentials (e.g. a bad password), or your browser doesn't
        understand how to supply the credentials required.
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'
    '404':
      description: 404 Not Found.
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP404'
