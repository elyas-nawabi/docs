get:
  tags:
    - currency
  summary: Get currency details.
  description: Get currency details.
  operationId: getCurrencies
  responses:
    '200':
      description: List of currencies.
      content:
        application/json:
          schema:
            type: object
            items:
              type: object
              properties:
                data:
                  properties:
                    active:
                      type: boolean
                    code:
                      type: string
                    id:
                      type: integer
                    name:
                      type: string
                    numeric_code:
                      type: string
                    rate:
                      type: float
                    symbol:
                      type: string
                errors:
                  type: object
                pagination:
                  type: object
                  page:
                    type: integer
                  per_page:
                    type: integer
                  total_pages:
                    type: integer
                  total_records:
                    type: integer
                status:
                  type: integer
                success_message:
                  type: string
          required:
            - code
          example:
            data:
              - active: true
                code: "AFN"
                id: 1
                name: "Afghani"
                numeric_code: "001"
                rate: 0.1
                symbol: "AFN"
            errors: null
            pagination:
              page: 1
              per_page: 100
              total_pages: 1
              total_records: 1
            status: 200
            success_message: null
    '401':
      description: >-
        401 Unauthorized: The server could not verify that you are
        authorized to access the URL requested. You either supplied the
        wrong credentials (e.g. a bad password), or your browser doesn't
        understand how to supply the credentials required.
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'
post:
  tags:
    - currency
  summary: Create a currency.
  description: Create a currency.
  operationId: postCurrencyById
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          $ref: '../../../api_doc.yaml#/components/schemas/CreateCurrency'
  responses:
    '201':
      description: OK
      content:
        application/json:
          schema:
            items:
              type: object
              properties:
                data:
                  properties:
                    active:
                      type: boolean
                    code:
                      type: string
                    digits:
                      type: integer
                    id:
                      type: integer
                    name:
                      type: string
                    numeric_code:
                      type: string
                    rate:
                      type: float
                    rates:
                      type: array
                      properties:
                        date: 
                          type: date
                        id: 
                          type: integer
                        rate: 
                          type: float
                    rounding:
                      type: float
                    symbol:
                      type: string
                errors:
                  type: object
                  nullable: true
                pagination:
                  type: object
                  nullable: true
                status:
                  type: integer
                success_message:
                  type: string
                  nullable: true
          example:
            data:
              active: true
              code: "AFN"
              digits: 2
              name: "Afghani"
              numeric_code: "001"
              rate: 0
              rates:
                - date: "2024-02-06"
                  id: 6
                  rate: 0.1
              rounding: 3
              symbol: "AFN"
            errors: null
            pagination: null
            status: 201
            success_message: null
    '401':
      description: >-
        401 Unauthorized: The server could not verify that you are
        authorized to access the URL requested. You either supplied the
        wrong credentials (e.g. a bad password), or your browser doesn't
        understand how to supply the credentials required.
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'
