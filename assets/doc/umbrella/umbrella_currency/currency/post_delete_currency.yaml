post:
  tags:
    - currency
  summary: Get currency details.
  description: Get currency details.
  operationId: getCurrencies
  requestBody:
        description: If you wish to apply filtering, please set the criteria; otherwise, send an empty JSON request.
        content:
          application/json:
            schema:
              type: object
              $ref: '../../../api_doc.yaml#/components/schemas/Filter'
  responses:
    '200':
      description: List of currencies.
      content:
        application/json:
          schema:
              type: object
              properties:
                data:
                  type: array
                  properties:
                    active:
                      type: boolean
                    code:
                      type: string
                    id:
                      type: integer
                    name:
                      type: string
                    numeric_code:
                      type: string
                    rate:
                      type: number
                      format: float
                    symbol:
                      type: string
                errors:
                  type: object
                pagination:
                  type: object
                  page:
                    type: integer
                  per_page:
                    type: integer
                  total_pages:
                    type: integer
                  total_records:
                    type: integer
                status:
                  type: integer
                success_message:
                  type: string
          required:
            - code
          example:
            data:
              - active: true
                code: "AFN"
                id: 1
                name: "Afghani"
                numeric_code: "001"
                rate: 0.1
                symbol: "AFN"
            errors: null
            pagination:
              page: 1
              per_page: 100
              total_pages: 1
              total_records: 1
            status: 200
            success_message: null
    '401':
      description: >-
        401 Unauthorized: The server could not verify that you are
        authorized to access the URL requested. You either supplied the
        wrong credentials (e.g. a bad password), or your browser doesn't
        understand how to supply the credentials required.
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'

delete:
  tags:
    - currency
  summary: Delete currencies.
  description: Delete currencies.
  operationId: deleteCurrenciesById
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          $ref: '../../../api_doc.yaml#/components/schemas/DeleteRequestBody'
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/DeleteApiResponse'
    '401':
      description: >-
        401 Unauthorized: The server could not verify that you are
        authorized to access the URL requested. You either supplied the
        wrong credentials (e.g. a bad password), or your browser doesn't
        understand how to supply the credentials required.
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'                
