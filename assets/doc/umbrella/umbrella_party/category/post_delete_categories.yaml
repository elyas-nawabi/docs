post:
      tags:
        - category
      summary: Create a category.
      description: Create a category.
      operationId: postCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              $ref: '../../../api_doc.yaml#/components/schemas/CreateCategory'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                  properties:
                    data:
                      type: object
                      properties:
                        childs:
                          type: array
                        id:
                          type: integer
                        name:
                          type: string
                        parent:
                          type: integer
                        parent_:
                          type: object
                    errors:
                      type: object
                      nullable: true
                    pagination:
                      type: object
                      nullable: true
                    status:
                      type: integer
                    success_message:
                      type: string
                      nullable: true
              example:
              - Please remove the square brackets from the start and end lines during post operation.
              - You are limited to selecting one example from the following.
              - data:
                  childs: []
                  id: 12
                  name: "testCtg1"
                  parent: null
                  parent_: {}
                errors: null
                pagination: null
                status: 201
                success_message: null
              - data:
                  childs: []
                  id: 13
                  name: "testCtg2"
                  parent: 4
                  parent_:
                    id: 4
                    name: "parentCtg"
                errors: null
                pagination: null
                status: 201
                success_message: null
              - data:
                  childs:
                    childs: []
                    id: 7
                    name: "test1"
                    parent: 6
                    parent_: 
                        id: 6
                        name: "parentctg / testCtg"
                  id: 14
                  name: "testCtg4"
                  parent: 4
                  parent_:
                    id: 4
                    name: "parentCtg"
                errors: null
                pagination: null
                status: 201
                success_message: null
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'

