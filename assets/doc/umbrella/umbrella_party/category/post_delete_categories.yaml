post:
      tags:
        - category
      summary: Create a category.
      description: Create a category.
      operationId: postCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              $ref: 'schemas/create-category.yaml'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                  properties:
                    data:
                      type: object
                      properties:
                        active: 
                          type: boolean
                        childs:
                          type: array
                          properties:
                            active: 
                              type: boolean
                            childs: 
                              type: array
                            id: 
                              type: integer
                            name:
                              type: string
                            parent: 
                              type: integer
                            parent_: 
                              $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
                            rec_name: "parentctg"
                        id:
                          type: integer
                        name:
                          type: string
                        parent:
                          type: integer
                          nullable: true
                        parent_:
                          $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
                        rec_name:
                          type: string
                    errors:
                      type: object
                      nullable: true
                    pagination:
                      type: object
                      nullable: true
                    status:
                      type: integer
                    success_message:
                      type: string
                      nullable: true
              example:
                data: 
                  active: true
                  childs:
                    - active: true
                      childs: []
                      id: 12
                      name: "testCtg1"
                      parent: null
                      parent_: {}
                      rec_name: "parentctg"
                  id: 12
                  name: "testCtg1"
                  parent: null
                  parent_: {}
                  rec_name: "parentctg"
                errors: null
                pagination: null
                status: 201
                success_message: null
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'

