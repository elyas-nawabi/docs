    post:
      tags:
        - contact mechanism
      summary: Get contact mechanism.
      description: Get contact mechanism.
      operationId: getContactMechanism
      requestBody:
        description: If you wish to apply filtering, please set the criteria; otherwise, send an empty JSON request.
        content:
          application/json:
            schema:
              type: object
              $ref: '../../../api_doc.yaml#/components/schemas/Filter'
      responses:
        '200':
          description: List of contact mechanisms.
          content:
            application/json:
              schema:
                  type: object
                  properties:
                    data:
                      type: array
                      properties:
                        address:
                          type: integer
                        address_:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                        id:
                          type: integer
                        name: 
                          type: string
                        party:
                          type: integer 
                        party_:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                        type:
                          type: string
                        value:
                          type: string 
                    errors:
                      type: object
                    pagination:
                      type: object
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_pages:
                        type: integer
                      total_records:
                        type: integer
                    status:
                      type: integer
                    success_message:
                      type: string
              example:
                data:
                  address: 2
                  address_:
                    id: 2
                    name: "abcParty, bl1, st12, 1007, Kabul, Afghanistan"
                  id: 2
                  name: "ctm1"
                  party: 1
                  party_:
                      "id": 1
                      "name": "Party 1"
                  type: "phone"
                  value: "8888"
                errors: null
                pagination:
                  page: 1
                  per_page: 100
                  total_pages: 1
                  total_records: 1
                status: 200
                success_message: null
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'  
    
    