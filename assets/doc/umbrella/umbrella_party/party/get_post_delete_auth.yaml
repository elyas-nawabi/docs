          description: List of parties.
          content:
            application/json:
              schema:
                type: object
                items:
                  type: object
                  properties:
                    data:
                      type: array
                      properties:
                        type: object
                        active:
                          type: boolean
                        code:
                          type: string
                        create_date:
                          type: date
                        id:
                          type: integer
                        name:
                          type: string
                    errors:
                      type: object
                    pagination:
                      type: object
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_pages:
                        type: integer
                      total_records:
                        type: integer
                    status:
                      type: integer
                    success_message:
                      type: string
              example:
                data:
                  - active: true
                    code: "1"
                    create_date: "2024-01-23T16:52:29.278731"
                    id: 1
                    name: "Party 1"
                errors: null
                pagination:
                  page: 1
                  per_page: 100
                  total_pages: 1
                  total_records: 1
                status: 200
                success_message: null
        '401':
