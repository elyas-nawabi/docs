                            value:
                              type: string
                        country:
                          type: integer
                        country_:
                          type: object
                          properties:
                            id: 
                              type: integer
                            name: 
                              type: string
                        delivery:
                          type: integer 
                        id: 
                          type: integer
                        invoice:
                          type: integer
                        name: 
                          type: string 
                        party: 
                          type: integer
                        party_:
                          type: object
                          properties:
                            id: 
                              type: integer
                            name: 
                              type: string
                        party_name:
                          type: string
                        postal_code:
                          type: string 
                        rec_name:
                          type: string 
                        sequence: 
                          type: integer
                        street: 
                          type: string 
                        subdivision: 
                          type: integer
                        subdivision_: 
                          type: object
                          properties:
                            id: 
                              type: integer
                            name: 
                              type: string
                    error:
                      type: object
                      nullable: true
                    pagination:
                      type: object
                      nullable: true
                    status:
                      type: integer
