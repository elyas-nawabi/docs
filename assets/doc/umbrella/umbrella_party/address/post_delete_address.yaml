post:
      tags:
        - address
      summary: Create an address.
      description: Create an address.
      operationId: postAddress
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              $ref: '../../../api_doc.yaml#/components/schemas/CreateAddress'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                  properties:
                    data:
                      type: object
                      properties:
                        active:
                          type: boolean
                        city:
                          type: string
                        contact_mechanisms:
                          type: array
                          properties:
                            type: 
                              type: string
                            value:
                              type: string
                            name: 
                              type: string
                            party:
                              type: integer
                            address:
                              type: integer
                        country:
                          type: integer
                        name: 
                          type: string 
                        party: 
                          type: integer
                        party_name:
                          type: string
                        postal_code:
                          type: string 
                        sequence: 
                          type: integer
                        street: 
                          type: string 
                        subdivision: 
                          type: integer
                    error:
                      type: object
                      nullable: true
                    pagination:
                      type: object
                      nullable: true
                    status:
                      type: integer
                    success_message:
                      type: string
                      nullable: true
              example:
                active: true
                city: "Herat"
                contact_mechanisms:
                  type: "phone"
                  value: "0771680235"
                  name: "ctm1"
                  party: 1 
                  address: 1
                country: 1
                name: "herat tower"
                party: 1
                party_name: "prt2"
                postal_code: "1002"
                sequence: 1
                street: "street 2"
                subdivision: 3
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'

