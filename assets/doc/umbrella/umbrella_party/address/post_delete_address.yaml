    post:
      tags:
        - address
      summary: Get addresses.
      description: Get addresses.
      operationId: getAddresses
     
      requestBody:
        description: If you wish to apply filtering, please set the criteria; otherwise, send an empty JSON request.
        content:
          application/json:
            schema:
              type: object
              $ref: '../../../api_doc.yaml#/components/schemas/ListAddress'
      responses:
        '200':
          description: List of addresses.
          content:
            application/json:
              schema:
                  type: object
                  properties:
                    data:
                      type: array
                      properties:
                        city:
                          type: string
                        country:
                          type: integer
                        id:
                          type: integer
                        name:
                          type: string
                        party: 
                          type: integer
                        party_:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                        party_name:
                          type: string
                        postal_code:
                          type: string 
                        street: 
                          type: string
                        subdivision:
                          type: integer
                        subdivision_:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                    errors:
                      type: object
                    pagination:
                      type: object
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_pages:
                        type: integer
                      total_records:
                        type: integer
                    status:
                      type: integer
                    success_message:
                      type: string
              example:
                data:
                - city: "kabul"
                  country: 1
                  country_:
                    id: 1
                    name: "Afghanistan"
                  id: 1
                  name: "shamali tower"
                  party: 1
                  party_:
                      id: 1
                      name: "Party 1"
                  party_name: "prt1"
                  postal_code: "1001"
                  street: "2nd street"
                  subdivision: 1
                  subdivision_:
                    id: 2
                    name: "sbd1"
                errors: null
                pagination:
                  page: 1
                  per_page: 100
                  total_pages: 1
                  total_records: 1
                status: 200
                success_message: null
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'  
    
    delete:
      tags:
        - address
      summary: Delete addresses.
      description: Delete addresses.
      operationId: deleteAddressesById
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              $ref: '../../../api_doc.yaml#/components/schemas/DeleteRequestBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../../../api_doc.yaml#/components/schemas/DeleteApiResponse'
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'
  