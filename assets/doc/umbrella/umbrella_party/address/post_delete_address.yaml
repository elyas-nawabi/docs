                            language: 
                              type: integer
                            name: 
                              type: string
                            party: 
                              type: integer
                            party_:
                              type: object
                              properties:
                                id:
                                  type: integer
                                name:
                                  type: string
                            rec_name: 
                              type: string
                            type: 
