    get:
      tags:
        - address
      summary: Get addresses.
      description: Get addresses.
      operationId: getAddresses
      responses:
        '200':
          description: List of addresses.
          content:
            application/json:
              schema:
                  type: object
                  properties:
                    data:
                      type: array
                      properties:
                        city:
                          type: string
                        country:
                          type: integer
                        id:
                          type: integer
                        name:
                          type: string
                        party: 
                          type: integer
                        party_:
                          type: object
                          properties:
                            label: 
                              type: string
                            value:
                              type: integer
                        party_name:
                          type: string
                        postal_code:
                          type: string 
                        street: 
                          type: string
                        subdivision:
                          type: integer
                        subdivision_:
                          type: object
                          properties:
                            label: 
                              type: string
                            value:
                              type: integer
                    errors:
                      type: object
                    pagination:
                      type: object
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_pages:
                        type: integer
                      total_records:
                        type: integer
                    status:
                      type: integer
                    success_message:
                      type: string
              example:
                data:
                - city: "kabul"
                  country: 1
                  country_:
                    label: "Afghanistan"
                    value: 1
                  id: 1
                  name: "shamali tower"
                  party: 1
                  party_:
                      label: "Party 1"
                      value: 1
                  party_name: "prt1"
                  postal_code: "1001"
                  street: "2nd street"
                  subdivision: 1
                  subdivision_:
                    label: "sbd1"
                    value: 2
                errors: null
                pagination:
                  page: 1
                  per_page: 100
                  total_pages: 1
                  total_records: 1
                status: 200
                success_message: null
