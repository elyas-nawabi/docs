get:
  tags:
    - appraisals
  summary: Confirm appraisal.
  description: Transition from state `new` to `pending` (confirmed).
  operationId: confirmAppraisalById
  parameters:
    - name: obj_id
      in: path
      required: true
      schema:
        type: integer
      example: 1
  responses:
    '200':
      description: Success envelope (no body payload beyond standard result).
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP200'
    '401':
      description: >-
        401 Unauthorized: The server could not verify that you are
        authorized to access the URL requested.
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'
    '404':
      description: Not found.
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP404'
