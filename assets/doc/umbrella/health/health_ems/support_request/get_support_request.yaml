                    rec_name: SRG-2024-00003
                    requestor: 
                    requestor_: {}
                    state: open
                    urgency: emergency
                    write_date: '2024-07-11T06:47:14.410944'
                    write_uid: 1
                    write_uid_:
                      id: 1
                      name: Administrator
