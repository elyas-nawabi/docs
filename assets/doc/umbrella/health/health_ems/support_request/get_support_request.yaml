                        rec_name: 
                          type: string
                        requestor: 
                          type: integer
                        requestor_:
                          $ref: '../../../../api_doc.yaml#/components/schemas/CommonType'
                        state: 
                          type: string
                        urgency: 
                          type: string
                        write_date:
                          type: string
                          format: date 
                        write_uid:
                          type: integer
                        write_uid_:
                          $ref: '../../../../api_doc.yaml#/components/schemas/CommonType'
                    errors:
                      type: object
                    pagination:
                      type: object
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_pages:
                        type: integer
                      total_records:
                        type: integer
                    status:
                      type: integer
                    success_message:
                      type: string
                      nullable: true
              example:
                data:
                  - code: SRG-2024-00003
                    create_date: '2024-07-06T03:52:57.172985'
                    create_uid: 1
