    post:
      tags:
        - ambulance
      summary: Get ambulance details.
      description: Get ambulance details.
      operationId: getAmbulances
      requestBody:
        description: If you wish to apply filtering, please set the criteria; otherwise, send an empty JSON request.
        content:
          application/json:
            schema:
              type: object
              $ref: '../../../../api_doc.yaml#/components/schemas/Filter'
      responses:
        '200':
          description: List of ambulances.
          content:
            application/json:
              schema:
                  type: object
                  properties:
                    data:
                      type: array
                      properties:
                        create_date: 
                          type: string 
                          format: date 
                        create_uid: 
                          type: integer
                        create_uid_:
                          $ref: '../../../../api_doc.yaml#/components/schemas/CommonType'
                        id: 
                          type: integer
                        rec_name: 
                          type: string
                        state: 
                          type: string
                        vehicle_function: 
                          type: string
                        vehicle_identifier: 
                          type: string
                        vehicle_station: 
                          type: integer
                        vehicle_station_: 
                          $ref: '../../../../api_doc.yaml#/components/schemas/CommonType'
                        vehicle_type: 
                          type: string
                        write_date:
                          type: string
                          format: date 
                        write_uid:
                          type: integer
                        write_uid_:
                          $ref: '../../../../api_doc.yaml#/components/schemas/CommonType'
                    errors:
                      type: object
                    pagination:
                      type: object
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_pages:
                        type: integer
                      total_records:
                        type: integer
                    status:
                      type: integer
                    success_message:
                      type: string
                      nullable: true
              example:
                data:
                  create_date: '2024-07-11T09:42:36.413284'
                  create_uid: 1
                  create_uid_:
                    id: 1
                    name: Administrator
                  id: 50
                  rec_name: '0004 : helicopter'
                  state: returning
                  vehicle_function: emergency
                  vehicle_identifier: '0004'
                  vehicle_station: 
                  vehicle_station_: {}
                  vehicle_type: helicopter
                  write_date: '2024-07-13T16:22:03.674553'
                  write_uid: 1
                  write_uid_:
                    id: 1
                    name: Administrator
                error: null
                pagination:
                  page: 1
                  per_page: 100
                  total_pages: 1
                  total_records: 9
                status: 200
                success_message: null
        
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../../../api_doc.yaml#/components/schemas/HTTP401'
    
    