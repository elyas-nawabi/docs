    post:
      tags:
        - protein disease
      summary: Get protein disease details.
      description: Get protein disease details.
      operationId: getProteinDiseases
      requestBody:
        description: If you wish to apply filtering, please set the criteria; otherwise, send an empty JSON request.
        content:
          application/json:
            schema:
              type: object
              $ref: '../../../../api_doc.yaml#/components/schemas/Filter'
      responses:
        '200':
          description: List of protein diseases.
          content:
            application/json:
              schema:
                  type: object
                  properties:
                    data:
                      type: array
                      properties:
                          acronym: 
                            type: string
                          create_date: 
                            type: string 
                            format: date 
                          create_uid: 
                            type: integer
                          create_uid_:
                            $ref: '../../../../api_doc.yaml#/components/schemas/CommonType'
                          disease_name: 
                            type: string
                          id: 
                            type: integer
                          inheritance_pattern:
                            type: string 
                          keywords: 
                            type: string
                          name: 
                            type: string
                          rec_name: 
                            type: string
                          write_date:
                            type: string
                            format: date 
                          write_uid:
                            type: integer
                          write_uid_:
                            $ref: '../../../../api_doc.yaml#/components/schemas/CommonType'
                          xrefs: 
                            type: string
                    errors:
                      type: object
                    pagination:
                      type: object
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_pages:
                        type: integer
                      total_records:
                        type: integer
                    status:
                      type: integer
                    success_message:
                      type: string
                      nullable: true
              example:
                data:
                  - acronym: HSD10MD
                    create_date: '2024-05-27T12:29:51.795048'
                    create_uid: 0
                    create_uid_:
                      id: 0
                      name: Root
                    disease_name: HDS10 mitochondrial disease
                    id: 1
                    inheritance_pattern: 
                    keywords: Neurodegeneration
                    name: DI-00001
                    rec_name: DI-00001:HDS10 mitochondrial disease
                    write_date: 
                    write_uid: 
                    write_uid_: {}
                    xrefs: MIM:300438,MedGen:C1845517,MeSH:D020739
                error: null
                pagination:
                  page: 1
                  per_page: 100
                  total_pages: 1
                  total_records: 9
                status: 200
                success_message: null
        
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../../../api_doc.yaml#/components/schemas/HTTP401'
    
    