    post:
      tags:
        - dentistry treatment
      summary: Get dentistry treatment details.
      description: Get dentistry treatment details.
      operationId: getDentistryTreatments
      requestBody:
        description: If you wish to apply filtering, please set the criteria; otherwise, send an empty JSON request.
        content:
          application/json:
            schema:
              type: object
              $ref: '../../../../api_doc.yaml#/components/schemas/Filter'
      responses:
        '200':
          description: List of dentistry treatments.
          content:
            application/json:
              schema:
                  type: object
                  properties:
                    data:
                      type: array
                      properties:
              
                        create_date: 
                          type: string 
                          format: date 
                        create_uid: 
                          type: integer
                        create_uid_:
                          $ref: '../../../../api_doc.yaml#/components/schemas/CommonType'
                        healthprof: 
                          type: integer
                        healthprof_:
                          $ref: '../../../../api_doc.yaml#/components/schemas/CommonType'
                          
                        id: 
                          type: integer
                        patient: 
                          type: integer
                        patient_:
                          $ref: '../../../../api_doc.yaml#/components/schemas/CommonType'
                          
                        procedures_info: 
                          type: string
                        rec_name: 
                          type: string
                        state: 
                          type: string
                        treatment_date: 
                          type: string
                          format: date
                        
                        write_date:
                          type: string
                          format: date 
                        write_uid:
                          type: integer
                        write_uid_:
                          $ref: '../../../../api_doc.yaml#/components/schemas/CommonType'
                    errors:
                      type: object
                    pagination:
                      type: object
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_pages:
                        type: integer
                      total_records:
                        type: integer
                    status:
                      type: integer
                    success_message:
                      type: string
                      nullable: true
              example:
                data:
                - create_date: '2024-08-03T07:25:04.254445'
                  create_uid: 1
                  create_uid_:
                    id: 1
                    name: Administrator
                  healthprof: 1
                  healthprof_:
                    id: 1
                    name: Milestone
                  id: 1
                  patient: 17
                  patient_:
                    id: 17
                    name: Milestone
                  procedures_info: BRAC (13)
                  rec_name: '1'
                  state: pending
                  treatment_date: '2024-08-03'
                  write_date: '2024-08-03T07:25:25.156415'
                  write_uid: 1
                  write_uid_:
                    id: 1
                    name: Administrator
                error: null
                pagination:
                  page: 1
                  per_page: 100
                  total_pages: 1
                  total_records: 9
                status: 200
                success_message: null
        
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../../../api_doc.yaml#/components/schemas/HTTP401'
    
    