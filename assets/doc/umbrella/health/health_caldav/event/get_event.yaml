    post:
      tags:
        - event
      summary: Get event details.
      description: Get event details.
      operationId: getEvent
      requestBody:
        description: If you wish to apply filtering, please set the criteria; otherwise, send an empty JSON request.
        content:
          application/json:
            schema:
              type: object
              $ref: '../../../../api_doc.yaml#/components/schemas/Filter'
      responses:
        '200':
          description: List of events.
          content:
            application/json:
              schema:
                  type: object
                  properties:
                    data:
                      type: array
                      properties:
                        all_day: 
                          type: boolean
                        calendar: 
                          type: integer
                        calendar_:
                          $ref: '../../../../api_doc.yaml#/components/schemas/CommonType'
                      
                        create_date: 
                          type: string 
                          format: date 
                        create_uid: 
                          type: integer
                        create_uid_:
                          $ref: '../../../../api_doc.yaml#/components/schemas/CommonType'
                        dtend: 
                          type: string 
                          format: date
                        dtstart: 
                          type: string 
                          format: date
                        id: 
                          type: integer
                        rec_name: 
                          type: string 
                        status: 
                          type: string 
                        summary: 
                          type: string 
                        write_date:
                          type: string
                          format: date 
                        write_uid:
                          type: integer
                        write_uid_:
                          $ref: '../../../../api_doc.yaml#/components/schemas/CommonType'
                    errors:
                      type: object
                    pagination:
                      type: object
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_pages:
                        type: integer
                      total_records:
                        type: integer
                    status:
                      type: integer
                    success_message:
                      type: string
                      nullable: true
              example:
                data:
                  - all_day: true
                    calendar: 1
                    calendar_:
                      id: 1
                      name: '2025'
                    create_date: '2024-08-03T06:21:04.042928'
                    create_uid: 1
                    create_uid_:
                      id: 1
                      name: Administrator
                    dtend: '2024-08-08T06:19:00'
                    dtstart: '2024-08-01T06:19:00'
                    id: 3
                    rec_name: summary desc
                    status: confirmed
                    summary: summary desc
                    write_date: '2024-08-03T06:21:04.042928'
                    write_uid: 1
                    write_uid_:
                      id: 1
                      name: Administrator
                error: null
                pagination:
                  page: 1
                  per_page: 100
                  total_pages: 1
                  total_records: 9
                status: 200
                success_message: null
        
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../../../api_doc.yaml#/components/schemas/HTTP401'
    
    