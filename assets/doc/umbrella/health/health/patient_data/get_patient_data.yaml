    post:
      tags:
        - patient data
      summary: Get patient data details.
      description: Get patient data details.
      operationId: getPatientData
      requestBody:
        description: If you wish to apply filtering, please set the criteria; otherwise, send an empty JSON request.
        content:
          application/json:
            schema:
              type: object
              $ref: '../../../../api_doc.yaml#/components/schemas/Filter'
      responses:
        '200':
          description: List of patient datas.
          content:
            application/json:
              schema:
                  type: object
                  properties:
                    data:
                      type: array
                      properties:
                        age: 
                          type: integer
                        create_date: 
                          type: string 
                          format: date 
                        create_uid: 
                          type: integer
                        create_uid_:
                          $ref: '../../../../api_doc.yaml#/components/schemas/CommonType'
                        id: 
                          type: integer
                        name: 
                          type: integer
                        name_:
                          $ref: '../../../../api_doc.yaml#/components/schemas/CommonType'
                        patient_status: 
                          type: boolean
                        puid: 
                          type: string
                        rec_name: 
                          type: string
                        write_date:
                          type: string
                          format: date 
                        write_uid:
                          type: integer
                        write_uid_:
                          $ref: '../../../../api_doc.yaml#/components/schemas/CommonType'
                    errors:
                      type: object
                    pagination:
                      type: object
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_pages:
                        type: integer
                      total_records:
                        type: integer
                    status:
                      type: integer
                    success_message:
                      type: string
                      nullable: true
              example:
                data:
                  age: 29
                  create_date: '2024-07-25T20:03:12.644563'
                  create_uid: 1
                  create_uid_:
                    id: 1
                    name: Administrator
                  id: 24
                  name: 40
                  name_:
                    id: 40
                    name: ayesha
                  patient_status: false
                  puid: EPG711ERX
                  rec_name: ayesha
                  write_date: 
                  write_uid: 
                  write_uid_: {}
                error: null
                pagination:
                  page: 1
                  per_page: 100
                  total_pages: 1
                  total_records: 9
                status: 200
                success_message: null
        
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../../../api_doc.yaml#/components/schemas/HTTP401'
    
    