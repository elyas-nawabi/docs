                        state: 
                          type: string
                        urgency: 
                          type: string
                        visit_type: 
                          type: string
                        write_date:
                          type: string
                          format: date 
                        write_uid:
                          type: integer
                        write_uid_:
                          $ref: '../../../../api_doc.yaml#/components/schemas/CommonType'
                    errors:
                      type: object
                    pagination:
                      type: object
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_pages:
                        type: integer
                      total_records:
                        type: integer
                    status:
                      type: integer
                    success_message:
                      type: string
                      nullable: true
              example:
                data:
                  - appointment_date: '2024-07-23T17:58:51'
                    create_date: '2024-07-23T18:01:36.152001'
                    create_uid: 1
                    create_uid_:
                      id: 1
