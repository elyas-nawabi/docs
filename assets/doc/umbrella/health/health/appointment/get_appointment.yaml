                    id: 1
                    patient: 17
                    patient_:
                      id: 17
                      name: Milestone
                    rec_name: APP 2024/1
                    speciality: 1
                    speciality_:
                      id: 1
                      name: Anatomy
                    state: confirmed
                    urgency: b
                    visit_type: new
                    write_date: 
                    write_uid: 
                    write_uid_: {}
                error: null
