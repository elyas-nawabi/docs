    post:
      tags:
        - company
      summary: Get company details.
      description: Get company details.
      operationId: getCompanies
      requestBody:
        description: If you wish to apply filtering, please set the criteria; otherwise, send an empty JSON request.
        content:
          application/json:
            schema:
              type: object
              $ref: '../../../api_doc.yaml#/components/schemas/Filter'
      responses:
        '200':
          description: List of companies.
          content:
            application/json:
              schema:
                  type: object
                  properties:
                    data:
                      type: array
                      properties:
                        create_date: 
                          type: string 
                          format: date 
                        create_uid: 
                          type: integer
                        create_uid_:
                          $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
                        currency: 
                          type: integer
                        currency_:
                          $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
                        id:
                          type: integer
                        party:
                          type: string
                        party_:
                          $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
                        payable_today:
                          type: number
                          format: float
                        rec_name:
                          type: string
                        receivable_today:
                          type: number
                          format: float
                        timezone: 
                          type: string
                        write_date:
                          type: string
                          format: date 
                        write_uid:
                          type: integer
                        write_uid_:
                          $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
                    errors:
                      type: object
                    pagination:
                      type: object
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_pages:
                        type: integer
                      total_records:
                        type: integer
                    status:
                      type: integer
                    success_message:
                      type: string
                      nullable: true
              example:
                data:
                - create_date: '2024-04-18T04:45:50.705070'
                  create_uid: 1
                  create_uid_:
                    id: 1
                    name: Administrator
                  currency: 1
                  currency_:
                    id: 1
                    name: Afghani
                  id: 1
                  party: 1
                  party_:
                    id: 1
                    name: Milestone
                  payable_today: 0
                  rec_name: Milestone
                  receivable_today: -8700
                  timezone: Asia/Kabul
                  write_date: 
                  write_uid: 
                  write_uid_: {}
                error: null
                pagination:
                  page: 1
                  per_page: 100
                  total_pages: 1
                  total_records: 9
                status: 200
                success_message: null
        
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'
    
    