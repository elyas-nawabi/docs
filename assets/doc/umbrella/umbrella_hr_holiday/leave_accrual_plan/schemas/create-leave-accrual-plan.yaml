type: object
properties:
  company:
    type: integer
    example: 1
  leave_type:
    type: integer
    example: 2
  active:
    type: boolean
    example: true
  transition_mode:
    type: string
    example: immediate
  accrued_gain_time:
    type: string
    example: month
  can_be_carryover:
    type: boolean
    example: true
  added_value_type:
    type: string
    example: day
  carryover_month:
    type: string
    example: '12'
  carryover_day:
    type: integer
    example: 31
  levels:
    type: array
    items:
      type: integer
    example: []
required:
  - company
  - leave_type
