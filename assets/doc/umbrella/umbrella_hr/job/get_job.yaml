post:
  tags:
    - job position
  summary: Get job position details.
  description: Get job position details.
  operationId: getCurrencies
  requestBody:
        description: If you wish to apply filtering, please set the criteria; otherwise, send an empty JSON request.
        content:
          application/json:
            schema:
              type: object
              $ref: '../../../api_doc.yaml#/components/schemas/Filter'
  responses:
    '200':
      description: List of job positions.
      content:
        application/json:
          schema:
              type: object
              properties:
                data:
                  type: array
                  properties:
                    create_date: 
                      type: string 
                      format: date 
                    create_uid: 
                      type: integer
                    create_uid_:
                      $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
                    company: 
                      type: integer
                    company_:
                      $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
                    department: 
                      type: integer
                    department_:
                      $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
                    expected_employees: 
                      type: integer
                    id: 
                      type: integer
                    name: 
                      type: string
                    no_of_employee: 
                      type: integer
                    no_of_recruitment: 
                      type: integer
                    rec_name: 
                      type: string
                    write_date:
                      type: string
                      format: date 
                    write_uid:
                      type: integer
                error:
                  type: object
                  nullable: true
                pagination:
                  type: object
                  properties:
                    page:
                      type: integer
                    per_page:
                      type: integer
                    total_pages:
                      type: integer
                    total_records:
                      type: integer
                status:
                  type: integer
                success_message:
                  type: string
                  nullable: true
          example:
            data:
              - company: 1
                company_:
                  id: 1
                  name: Milestone
                create_date: '2025-03-16T10:29:23.307830'
                create_uid: 1
                create_uid_:
                  id: 1
                  name: Administrator
                department: 2
                department_:
                  id: 2
                  name: Technical / IT
                expected_employees: 0
                id: 1
                name: Manager
                no_of_employee: 1
                no_of_recruitment: 1
                rec_name: Manager
                write_date: 
                write_uid: 

            error: null
            pagination:
              page: 1
              per_page: 100
              total_pages: 1
              total_records: 9
            status: 200
            success_message: null
    
    '401':
      description: >-
        401 Unauthorized: The server could not verify that you are
        authorized to access the URL requested. You either supplied the
        wrong credentials (e.g. a bad password), or your browser doesn't
        understand how to supply the credentials required.
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'
