post:
  tags:
    - work location
  summary: Get work location details.
  description: Get work location details.
  operationId: getWorkLocation
  requestBody:
        description: If you wish to apply filtering, please set the criteria; otherwise, send an empty JSON request.
        content:
          application/json:
            schema:
              type: object
              $ref: '../../../api_doc.yaml#/components/schemas/Filter'
  responses:
    '200':
      description: List of work locations.
      content:
        application/json:
          schema:
              type: object
              properties:
                data:
                  type: array
                  properties:
                    create_date: 
                      type: string 
                      format: date 
                    create_uid: 
                      type: integer
                    create_uid_:
                      $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
                    active: 
                      type: boolean
                    address: 
                      type: integer
                    address_:
                      $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
                    company: 
                      type: integer
                    company_:
                      $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
                    id: 
                      type: integer
                    location_number: 
                      type: string
                    location_type: 
                      type: string
                    name: 
                      type: string
                    rec_name: 
                      type: string
                    write_date:
                      type: string
                      format: date 
                    write_uid:
                      type: integer
                error:
                  type: object
                  nullable: true
                pagination:
                  type: object
                  properties:
                    page:
                      type: integer
                    per_page:
                      type: integer
                    total_pages:
                      type: integer
                    total_records:
                      type: integer
                status:
                  type: integer
                success_message:
                  type: string
                  nullable: true
          example:
            data:
              - active: true
                address: 20
                address_:
                  id: 20
                  name: kabul
                company: 1
                company_:
                  id: 1
                  name: Milestone
                create_date: '2025-03-16T10:27:06.234122'
                create_uid: 1
                create_uid_:
                  id: 1
                  name: Administrator
                id: 1
                location_number: '123'
                location_type: home
                name: kabul
                rec_name: kabul
                write_date: 
                write_uid:

            error: null
            pagination:
              page: 1
              per_page: 100
              total_pages: 1
              total_records: 1
            status: 200
            success_message: null
    
    '401':
      description: >-
        401 Unauthorized: The server could not verify that you are
        authorized to access the URL requested. You either supplied the
        wrong credentials (e.g. a bad password), or your browser doesn't
        understand how to supply the credentials required.
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'
