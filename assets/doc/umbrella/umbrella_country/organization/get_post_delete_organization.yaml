    get:
      tags:
        - organization
      summary: Get organization details.
      description: Get organization details.
      operationId: getOrganizations
      responses:
        '200':
          description: List of organizations.
          content:
            application/json:
              schema:
                  type: object
                  properties:
                    data:
                      type: array
                      properties:
                        code:
                          type: string
                        id: 
                          type: integer
                        name: 
                          type: string
                    errors:
                      type: object
                    pagination:
                      type: object
                      properties:
                        page:
                          type: integer
                        per_page:
                          type: integer
                        total_pages:
                          type: integer
                        total_records:
                          type: integer
                    status:
                      type: integer
                    success_message:
                      type: string
                      nullable: true
              example:
                data:
                - code: EU
                  id: 1
                  name: European Union
                error: null
                pagination:
                  page: 1
                  per_page: 100
                  total_pages: 1
                  total_records: 9
                status: 200
                success_message: null
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'
    post:
      tags:
        - organization
      summary: Create a organization.
      description: Create a organization.
      operationId: postOrganizationById
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              $ref: '../../../api_doc.yaml#/components/schemas/CreateOrganization'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                    properties:
                      data:
                        code:
                          type: string
                        id:
                          type: integer
                        members:
                          type: array
                          properties:
                            country:
                              type: integer
                            country_:
                              id:
                                type: integer
                              name:
                                type: string
                            from_date:
                              type: string
                              format: date
                            id:
                              type: integer
                            to_date:
                              type: string
                              format: date
                        name: 
                          type: string
                      errors:
                        type: object
                        nullable: true
                      pagination:
                        type: object
                        nullable: true
                      status:
                        type: integer
                      success_message:
                        type: string
                        nullable: true

              example:
                data:
                  code: EU
                  id: 1
                  members:
                  - country: 1
                    country_:
                      id: 1
                      name: "Afghanistan"
                    from_date: '2024-02-15'
                    id: 1
                    to_date: '2024-02-20'
                  name: European Union
                error: null
                pagination: null
                status: 200
                success_message: null
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'
