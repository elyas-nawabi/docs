post:
      tags:
        - organization
      summary: Create a organization.
      description: Create a organization.
      operationId: postOrganizationById
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              $ref: '../../../api_doc.yaml#/components/schemas/CreateOrganization'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                    properties:
                      data:
                        code:
                          type: string
                        id:
                          type: integer
                        members:
                          type: array
                          properties:
                            country:
                              type: integer
                            country_:
                              id:
                                type: integer
                              name:
                                type: string
                            from_date:
                              type: string
                              format: date
                            id:
                              type: integer
                            rec_name:
                              type: string
                            to_date:
                              type: string
                              format: date
                        name: 
                          type: string
                      errors:
                        type: object
                        nullable: true
                      pagination:
                        type: object
                        nullable: true
                      status:
                        type: integer
                      success_message:
                        type: string
                        nullable: true

              example:
                data:
                  code: SAFTA20
                  id: 20
                  members:
                  - country: 1
                    country_:
                      id: 1
                      name: "Afghanistan"
                    from_date: '2024-02-15'
                    id: 5
                    rec_name: "1"
                    to_date: '2024-02-20'
                  name: South Asian Free Trade Area20
                error: null
                pagination: null
                status: 200
                success_message: null
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'

