    get:
      tags:
        - region
      summary: Get region details.
      description: Get region details.
      operationId: getRegion
      responses:
        '200':
          description: List of regions.
          content:
            application/json:
              schema:
                  type: object
                  properties:
                    data:
                      type: array
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                    errors:
                      type: object
                    pagination:
                      type: object
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_pages:
                        type: integer
                      total_records:
                        type: integer
                    status:
                      type: integer
                    success_message:
                      type: string
                      nullable: true
              example:
                data:
                - id: 1
                  name: Afghanistan
                error: null
                pagination:
                  page: 1
                  per_page: 100
                  total_pages: 1
                  total_records: 9
                status: 200
                success_message: null
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'
    post:
      tags:
        - region
      summary: Create a region.
      description: Create a region.
      operationId: postRegionById
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              $ref: '../../../api_doc.yaml#/components/schemas/CreateRegion'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                    properties:
                      data:
                        code_numeric:
                          type: string
                        name:
                          type: string
                        parent:
                          type: integer
                        subregions:
                          type: array
                          properties:
                            code_numeric:
                              type: string
                            name: 
                              type: string
                            parent:
                              type: integer
                            subregions:
                              type: array
                      errors:
                        type: object
                        nullable: true
                      pagination:
                        type: object
                        nullable: true
                      status:
                        type: integer
                      success_message:
                        type: string
                        nullable: true

              required:
                - name
              example:
                data:
                  code_numeric: '190'
                  name: NewCountry
                  parent: 1
                  subregions:
                  - code_numeric: '015'
                    name: Northern Africa
                    parent: 2
                    subregions: []
                error: null
                pagination: null
                status: 200
                success_message: null
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'
