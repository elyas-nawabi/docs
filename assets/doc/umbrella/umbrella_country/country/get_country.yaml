    post:
      tags:
        - country
      summary: Get country details.
      description: Get country details.
      operationId: getCountries
      requestBody:
        description: If you wish to apply filtering, please set the criteria; otherwise, send an empty JSON request.
        content:
          application/json:
            schema:
              type: object
              $ref: '../../../api_doc.yaml#/components/schemas/Filter'
      responses:
        '200':
          description: List of countries.
          content:
            application/json:
              schema:
                  type: object
                  properties:
                    data:
                      type: array
                      properties:
                        code:
                          type: string
                        code3:
                          type: string
                        code_numeric: 
                          type: string
                        id: 
                          type: integer
                        name:
                          type: string
                        rec_name: 
                          type: string
                        region: 
                          type: integer
                        region_:
                          $ref: '../../../api_doc.yaml#/components/schemas/CommonType'
                    errors:
                      type: object
                      nullable: true
                    pagination:
                      type: object
                      properties:
                        page:
                          type: integer
                        per_page:
                          type: integer
                        total_pages:
                          type: integer
                        total_records:
                          type: integer
                    status:
                      type: integer
                    success_message:
                      type: string
                      nullable: true
              example:
                data:
                - code: '1'
                  code3: '101'
                  code_numeric: '10001'
                  id: 1
                  name: Afghanistan
                  rec_name: "Afghanistan"
                  region: 34
                  region_:
                    id: 34
                    name: kabul
                error: null
                pagination:
                  page: 1
                  per_page: 100
                  total_pages: 1
                  total_records: 9
                status: 200
                success_message: null
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'
    
    