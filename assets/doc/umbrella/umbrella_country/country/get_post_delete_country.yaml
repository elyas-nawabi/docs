        - country
      summary: Get country details.
      description: Get country details.
      operationId: getCountries
      responses:
        '200':
          description: List of countries.
          content:
            application/json:
              schema:
                  type: object
                  properties:
                    data:
                      type: array
                      properties:
                        id:
                          type: integer
                        name:
                          type: string
                    errors:
                      type: object
                      nullable: true
                    pagination:
                      type: object
                      properties:
                        page:
                          type: integer
                        per_page:
                          type: integer
                        total_pages:
                          type: integer
                        total_records:
                          type: integer
                    status:
                      type: integer
                    success_message:
                      type: string
                      nullable: true
              example:
                data:
                - id: 1
                  name: "Afghanistan"
                error: null
                pagination:
                  page: 1
                  per_page: 100
                  total_pages: 1
                  total_records: 9
                status: 200
                success_message: null
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
