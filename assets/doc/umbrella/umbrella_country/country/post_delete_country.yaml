post:
      tags:
        - country
      summary: Create a country.
      description: Create a country.
      operationId: postCountryById
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              $ref: '../../../api_doc.yaml#/components/schemas/CreateCountry'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                    properties:
                      data:
                        type: object
                        properties:
                          active:
                            type: boolean
                          code:
                            type: string
                          code3:
                            type: string
                          code_numeric:
                            type: string
                          id:
                            type: integer
                          members:
                            type: array
                            properties:
                                from_date: 
                                  type: string
                                  format: date
                                id: 
                                  type: integer
                                organization:
                                  type: integer
                                organization_:
                                  type: object
                                  properties:
                                    id:
                                      type: integer
                                    name: 
                                      type: string
                                rec_name: 
                                  type: string
                                to_date: 
                                  type: string
                                  format: date
                          name:
                            type: string
                          rec_name: 
                            type: string
                          region:
                            type: integer
                          region_:
                            type: object
                            properties:
                              id:
                                type: integer
                              name:
                                type: string
                          subdivisions:
                            type: array
                            properties:
                              active:
                                type: boolean
                              code:
                                type: string
                              id:
                                type: integer
                              name:
                                type: string
                              parent: 
                                type: integer
                              parent_:
                                type: object
                              rec_name: 
                                type: string
                              type:
                                type: string
                      errors:
                        type: object
                        nullable: true
                      pagination:
                        type: object
                        nullable: true
                      status:
                        type: integer
                      success_message:
                        type: string
                        nullable: true
              example:
                data:
                  active: true
                  code: '1'
                  code3: '101'
                  code_numeric: '10001'
                  id: 1
                  members:
                  - from_date: '2024-02-15'
                    id: 5
                    organization: 20
                    organization_:
                      id: 20
                      name: South Asian Free Trade Area20
                    rec_name: '5'
                    to_date: '2024-02-20'
                  name: Afghanistan
                  rec_name: "Afghanistan"
                  region: 34
                  region_:
                    id: 34
                    name: kabul
                  subdivisions:
                  - active: true
                    code: '10001'
                    id: 3
                    name: sbd1
                    parent: 
                    parent_: {}
                    rec_name: sbd1
                    type: city
                error: null
                pagination: null
                status: 200
                success_message: null
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'
    
