post:
      tags:
        - chart of tax codes
      summary: Create a chart of tax codes.
      description: Create a chart of tax codes.
      operationId: postChartOfTaxCodes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              $ref: '../../../api_doc.yaml#/components/schemas/CreateChartOfTaxCodes'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                  type: object
                  properties:
                    data: 
                      type: array
                      properties:
                        context:
                          type: object
                          properties:
                            company:
                              type: integer
                            end_period: 
                              type: integer
                            fiscalyear: 
                              type: integer
                            method:
                              type: string
                            period: 
                              type: integer
                            periods:
                              type: array
                            start_period: 
                              type: integer
                    errors:
                      type: object
                    pagination:
                      properties:
                        page:
                          type: integer
                        per_page:
                          type: integer
                        total_pages:
                          type: integer
                        total_records:
                          type: integer
                    status:
                      type: integer
                    success_message:
                      type: string
              example:
                data:
                  context:
                    company: 1
                    end_period: 2
                    fiscalyear: 2
                    method: period
                    period: 2
                    periods: []
                    start_period: 2
                errors: null
                pagination: null
                status: 200
                success_message: null
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'
    