post:
      tags:
        - general ledger
      summary: Create a general ledger.
      description: Create a general ledger.
      operationId: postGeneralLedger
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              $ref: '../../../api_doc.yaml#/components/schemas/CreateGeneralLedger'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                  type: object
                  properties:
                    data: 
                      type: array
                      properties:
                          account:  
                            type: integer
                          account_:
                            type: object
                            properties:
                              id: 
                                type: integer
                              name: 
                                type: string
                          active:
                            type: boolean
                          credit: 
                            type: integer
                          currency: 
                            type: integer
                          currency_:
                            type: object
                            properties:
                              id: 
                                type: integer
                              name: 
                                type: string
                          debit: 
                            type: integer
                          end_balance: 
                            type: integer
                          id: 
                            type: integer
                          line_count: 
                            type: integer
                          rec_name:
                            type: string
                          start_balance: 
                            type: integer
                      
                    errors:
                      type: object
                    pagination:
                      properties:
                        page:
                          type: integer
                        per_page:
                          type: integer
                        total_pages:
                          type: integer
                        total_records:
                          type: integer
                    status:
                      type: integer
                    success_message:
                      type: string
              example:
                data:
                  - account: 29
                    account_:
                      id: 29
                      name: 1 - 1
                    active: true
                    credit: 0
                    currency: 1
                    currency_:
                      id: 1
                      name: Afghani
                    debit: 0
                    end_balance: 0
                    id: 29
                    line_count: 0
                    rec_name: 1 - 1
                    start_balance: 0
                errors: null
                pagination: null
                status: 200
                success_message: null
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'
    