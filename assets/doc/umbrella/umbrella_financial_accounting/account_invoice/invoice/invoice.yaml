  '/financial-accounting/invoices/{obj_id}/recall-deposit':
    $ref: 'recall_deposit_by_id.yaml'
  '/financial-accounting/invoices/{obj_id}/process':
    $ref: 'process_by_id.yaml'
  '/financial-accounting/invoices/{obj_id}/pay':
