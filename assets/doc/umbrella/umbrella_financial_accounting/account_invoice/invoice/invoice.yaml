  '/financial-accounting/invoices/{obj_id}/modify-payee':
    $ref: 'post_modify_payee_by_id.yaml'
  '/financial-accounting/invoices/{obj_id}/reschedule/preview':
    $ref: 'post_reschedule_preview_by_id.yaml'
  '/financial-accounting/invoices/{obj_id}/reschedule':
    $ref: 'post_reschedule_by_id.yaml'