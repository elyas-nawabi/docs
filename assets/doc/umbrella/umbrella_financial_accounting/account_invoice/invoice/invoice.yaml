openapi: 3.1.0
servers:
  - url: 'http://api-alpha.umbrellaerp.com'
tags:
  - name: invoice
    description: invoice - invoice data management.
paths:
  '/financial-accounting/invoices/search':
    $ref: 'get_invoice.yaml'
  '/financial-accounting/invoices':
    $ref: 'post_delete_invoice.yaml'
  '/financial-accounting/invoices/{obj_id}':
    $ref: 'get_put_invoice_by_id.yaml'
  '/financial-accounting/invoices/{obj_id}/draft':
    $ref: 'draft_by_id.yaml'
  '/financial-accounting/invoices/{obj_id}/validate':
