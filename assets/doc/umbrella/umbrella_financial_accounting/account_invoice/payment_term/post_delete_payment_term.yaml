post:
      tags:
        - payment term
      summary: Create a payment term.
      description: Create a payment term.
      operationId: postPaymentTermById
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              $ref: '../../../../api_doc.yaml#/components/schemas/CreatePaymentTerm'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                  type: object
                  properties:
                    data: 
                      active:
                        type: boolean
                      description: 
                        type: string
                      id: 
                        type: integer
                      lines:
                        properties:
                          amount: 
                            type: integer
                          currency: 
                            type: integer
                          currency_:
                            $ref: '../../../../api_doc.yaml#/components/schemas/CommonType'
                          divisor: 
                            type: integer
                          id: 
                            type: integer
                          payment: 
                            type: integer
                          ratio: 
                            type: integer
                          rec_name: 
                            type: string
                          relativedeltas:
                            type: array
                            properties:
                              day: 
                                type: integer
                              days: 
                                type: integer
                              id: 
                                type: integer
                              line: 
                                type: integer
                              month: 
                                type: integer
                              months: 
                                type: integer
                              rec_name:
                                type: string
                              sequence: 
                                type: integer
                              weekday: 
                                type: integer
                              weeks: 
                                type: integer
                        sequence: 
                          type: integer
                        type: 
                          type: string
                      name: 
                        type: string
                      rec_name: 
                        type: string
                    errors:
                      type: object
                    pagination:
                      properties:
                        page:
                          type: integer
                        per_page:
                          type: integer
                        total_pages:
                          type: integer
                        total_records:
                          type: integer
                    status:
                      type: integer
                    success_message:
                      type: string
              example:
                data:
                  active: true
                  description: payment term description here...
                  id: 1
                  lines:
                  - amount: 0
                    currency: 
                    currency_: {}
                    divisor: 0
                    id: 1
                    payment: 1
                    ratio: 0
                    rec_name: '1'
                    relativedeltas:
                    - day: 1
                      days: 1
                      id: 1
                      line: 1
                      month: 1
                      months: 1
                      rec_name: '1'
                      sequence: 1
                      weekday: 1
                      weeks: 1
                    sequence: 1
                    type: remainder
                  name: paymentTerm1
                  rec_name: paymentTerm1
                errors: null
                pagination: null
                status: 201
                success_message: null
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../../../api_doc.yaml#/components/schemas/HTTP401'

