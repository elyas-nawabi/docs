post:
      tags:
        - payment term
      summary: Test payment term.
      description: Test payment term.
      operationId: postTestById
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              $ref: 'schemas/create-test.yaml'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                  type: array
                  properties:
                    data: 
                        amount: 
                          type: integer
                        currency: 
                          type: integer
                        currency_:
                          $ref: '../../../../api_doc.yaml#/components/schemas/CommonType'
                        date:
                          type: string 
                          format: date
                    errors:
                      type: object
                    pagination:
                      properties:
                        page:
                          type: integer
                        per_page:
                          type: integer
                        total_pages:
                          type: integer
                        total_records:
                          type: integer
                    status:
                      type: integer
                    success_message:
                      type: string
              example:
                data:
                  - amount: 1
                    currency: 1
                    currency_:
                      id: 1
                      name: Afghani
                    date: '2024-02-12'
                errors: null
                pagination: null
                status: 201
                success_message: null
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../../../api_doc.yaml#/components/schemas/HTTP401'
    