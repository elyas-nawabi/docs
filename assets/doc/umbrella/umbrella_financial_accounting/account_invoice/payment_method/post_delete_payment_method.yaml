post:
      tags:
        - payment method
      summary: Create a payment method.
      description: Create a payment method.
      operationId: postPaymentMethodById
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              $ref: '../../../../api_doc.yaml#/components/schemas/CreatePaymentMethod'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                  type: object
                  properties:
                    data: 
                      active:
                        type: boolean
                      company: 
                        type: integer
                      company_:
                        type: object
                        properties:
                          id: 
                            type: integer
                          name:
                            type: string
                      credit_account: 
                        type: integer
                      credit_account_:
                        type: object
                        properties:
                          id: 
                            type: integer
                          name:
                            type: string
                      debit_account: 
                        type: integer
                      debit_account_:
                        type: object
                        properties:
                          id: 
                            type: integer
                          name:
                            type: string
                      id: 
                        type: integer
                      journal: 
                        type: integer
                      journal_:
                        type: object
                        properties:
                          id: 
                            type: integer
                          name:
                            type: string
                      name:
                        type: string
                      rec_name:
                        type: string
                    errors:
                      type: object
                    pagination:
                      properties:
                        page:
                          type: integer
                        per_page:
                          type: integer
                        total_pages:
                          type: integer
                        total_records:
                          type: integer
                    status:
                      type: integer
                    success_message:
                      type: string
              example:
                data:
                  active: true
                  company: 1
                  company_:
                    id: 1
                    name: Party 1
                  credit_account: 2
                  credit_account_:
                    id: 2
                    name: Main Cash
                  debit_account: 2
                  debit_account_:
                    id: 2
                    name: Main Cash
                  id: 1
                  journal: 3
                  journal_:
                    id: 3
                    name: Cash
                  name: payment method1
                  rec_name: payment method1 
                errors: null
                pagination: null
                status: 201
                success_message: null
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../../../api_doc.yaml#/components/schemas/HTTP401'

