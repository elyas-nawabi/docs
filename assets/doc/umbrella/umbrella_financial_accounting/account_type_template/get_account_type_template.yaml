post:
  tags:
    - account type template
  summary: Search account type templates (root types).
  description: |
    Search global account type templates. The API applies a fixed filter: only **root** type templates (`parent` is null) are returned.

    Each result includes a nested `childs` array with the full type subtree. Use `GET /account-type-templates/{obj_id}` for full fields on a specific node.

    **Note:** These templates define the account type hierarchy (Balance Sheet, Income Statement, Off-Balance) for an entire chart. To materialize them for a company use `GET /account-types/import-default-account-types-to-company/{company_id}`.
  operationId: searchAccountTypeTemplates
  requestBody:
    description: Optional filter criteria; send `{}` to list all root type templates.
    content:
      application/json:
        schema:
          type: object
          $ref: '../../../api_doc.yaml#/components/schemas/Filter'
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    rec_name:
                      type: string
                    childs:
                      type: array
                      description: Nested type template tree under this root.
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                          rec_name:
                            type: string
                          childs:
                            type: array
              errors:
                type: object
                nullable: true
              pagination:
                type: object
                properties:
                  page:
                    type: integer
                  per_page:
                    type: integer
                  total_pages:
                    type: integer
                  total_records:
                    type: integer
              status:
                type: integer
              success_message:
                type: string
                nullable: true
          example:
            data:
              - id: 1
                rec_name: Minimal Account Type Chart
                childs:
                  - id: 2
                    rec_name: Balance Sheet
                    childs:
                      - id: 3
                        rec_name: Assets
                        childs: []
                      - id: 4
                        rec_name: Liabilities
                        childs: []
                  - id: 5
                    rec_name: Income Statement
                    childs: []
            errors: null
            pagination:
              page: 1
              per_page: 100
              total_pages: 1
              total_records: 1
            status: 200
            success_message: null
    '401':
      description: >-
        401 Unauthorized: The server could not verify that you are
        authorized to access the URL requested. You either supplied the
        wrong credentials (e.g. a bad password), or your browser doesn't
        understand how to supply the credentials required.
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'
