post:
      tags:
        - tax code
      summary: Create a tax code.
      description: Create a tax code.
      operationId: postTaxCodeById
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              $ref: 'schemas/create-tax-code.yaml'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                  type: object
                  properties:
                    data: 
                      active: 
                        type: boolean
                      amount: 
                        type: integer
                      childs:
                        type: array
                      code: 
                        type: string
                      company: 
                        type: integer
                      company_:
                        type: object
                        properties:
                          id: 
                            type: integer
                          name: 
                            type: string
                      currency: 
                        type: integer
                      currency_:
                        type: object
                        properties:
                          id: 
                            type: integer
                          name: 
                            type: string
                      description:
                        type: string
                      end_date:
                        type: string
                        format: date
                      id: 
                        type: integer
                      lines: 
                        type: array
                      name: 
                        type: string
                      parent: 
                        type: integer
                      parent_:
                        type: object
                        properties:
                          id: 
                            type: integer
                          name: 
                            type: string
                      rec_name: 
                        type: string
                      start_date: 
                        type: string
                      template: 
                        type: integer
                      template_:
                        type: object
                        properties:
                          id: 
                            type: integer
                          name: 
                            type: string
                      template_override: 
                        type: boolean
                    errors:
                      type: object
                    pagination:
                      properties:
                        page:
                          type: integer
                        per_page:
                          type: integer
                        total_pages:
                          type: integer
                        total_records:
                          type: integer
                    status:
                      type: integer
                    success_message:
                      type: string
              example:
                data:
                  active: true
                  amount: 0
                  childs: []
                  code: '1'
                  company: 1
                  company_:
                    id: 1
                    name: Party 1
                  currency: 1
                  currency_:
                    id: 1
                    name: Afghani
                  description: ''
                  end_date: '2024-03-31'
                  id: 4
                  lines: []
                  name: '1'
                  parent: 3
                  parent_:
                    id: 3
                    name: 1 - txcode1
                  rec_name: 1 - 1
                  start_date: '2024-03-01'
                  template: 
                  template_: {}
                  template_override: false
                errors: null
                pagination: null
                status: 200
                success_message: null
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'

