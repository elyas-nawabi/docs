                        page:
                          type: integer
                        per_page:
                          type: integer
                        total_pages:
                          type: integer
                        total_records:
                          type: integer
                    status:
                      type: integer
                    success_message:
                      type: string
              example:
                data:
                  company: 1
                  company_:
                    id: 1
                    name: Party 1
                  id: 1
                  kind: both
                  lines:
                  - end_date: '2025-03-31'
                    group: 20
                    group_:
                      id: 20
                      name: '1'
                    id: 1
                    keep_origin: true
                    origin_tax: 24
                    origin_tax_:
                      id: 24
                      name: tx1
                    rec_name: '1'
                    sequence: 1
                    start_date: '2025-03-04'
                    tax: 23
                    tax_:
                      id: 23
                      name: tx1
                    template: 
                    template_: {}
                    template_override: false
                  name: tx_rule_2
                  rec_name: tx_rule_2
                  template: 
                  template_override: true
                errors: null
                pagination: null
                status: 200
                success_message: null
