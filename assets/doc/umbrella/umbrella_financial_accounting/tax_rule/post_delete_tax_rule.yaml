                          start_date: 
                            type: string
                            format: date
                          tax:
                            type: integer
                          tax_:
                            type: object
                            properties:
                              id: 
                                type: integer
                              name:
                                type: string
                          template:
                            type: integer 
                          template_: 
                            type: object
                            properties:
                              id: 
                                type: integer
                              name:
                                type: string
                          template_override:
                            type: boolean
                      name: 
                        type: string
                      rec_name: 
                        type: string
                      template: 
                        type: integer
                      template_override:
                        type: boolean
                    errors:
                      type: object
                    pagination:
