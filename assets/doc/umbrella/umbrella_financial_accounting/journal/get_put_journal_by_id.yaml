get:
      tags:
        - journal
      summary: Get one journal.
      description: Get one journal.
      operationId: getJournalById
      parameters:
        - name: obj_id
          in: path
          schema:
            type: integer
          rquired: true
          example: 2
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                  type: object
                  properties:
                    data:
                      type: object
                      properties:
                        active:
                          type: boolean
                        code:
                          type: string
                        id:
                          type: integer
                        matching_sequence:
                          type: integer
                        name:
                          type: string
                        rec_name:
                          type: string
                        sequence: 
                          type: string
                        sequence_:
                          label:
                            type: string
                          value:
                            type: integer
                        type: 
                          type: string
                    errors:
                      type: object
                    pagination:
                      items:
                        type: object
                      properties:
                        page:
                          type: integer
                        per_page:
                          type: integer
                        total_pages:
                          type: integer
                        total_records:
                          type: integer
                    status:
                      type: integer
                    success_message:
                      type: string
                      nullable: true
              example:
                data:
                  active: true
                  code: REV
                  id: 1
                  matching_sequence: 
                  name: Revenue
                  rec_name: Revenue
                  sequence: 2
                  sequence_:
                    label: Default Account Journal
                    value: 2
                  type: revenue
                error: null
                pagination: null
                status: 200
                success_message: null
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'
        '404':
          description: 404 Not Found.
          content:
            application/json:
              schema:
                $ref: '../../../api_doc.yaml#/components/schemas/HTTP404'

