get:
      tags:
        - journal
      summary: Get one journal.
      description: Get one journal.
      operationId: getJournalById
      parameters:
        - name: obj_id
          in: path
          schema:
            type: integer
          rquired: true
          example: 2
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: 'schema.yaml'
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'
        '404':
          description: 404 Not Found.
          content:
            application/json:
              schema:
                $ref: '../../../api_doc.yaml#/components/schemas/HTTP404'

put:
      tags:
        - journal
      summary: Update a journal.
      description: Update a journal.
      operationId: updateJournalById
      parameters:
        - name: obj_id
          rquired: true
          in: path
          schema:
            type: integer
          example: 19
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              $ref: 'schemas/create-journal.yaml'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: 'schema.yaml'
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'
    