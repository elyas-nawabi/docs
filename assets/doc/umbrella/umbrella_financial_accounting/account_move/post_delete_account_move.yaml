post:
      tags:
        - account move
      summary: Create an account move.
      description: Create an account move.
      operationId: postAccountMoveById
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              $ref: '../../../api_doc.yaml#/components/schemas/CreateAccountMove'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                  type: object
                  properties:
                    data: 
                      company:
                        type: integer
                      company_:
                        properties:
                            id:
                              type: integer
                            name:
                              type: string
                      date:
                        type: string
                        format: date
                      description: 
                        type: string
                      id:
                        type: integer
                      journal:
                        type: integer
                      journal_:
                        properties:
                            id:
                              type: integer
                            name:
                              type: string
                      lines:
                        type: array
                        nullable: true
                      number:
                        type: string
                      origin:
                        type: string
                      origin_: 
                        type: object
                      period:
                        type: integer
                      period_:
                        properties:
                            id:
                              type: integer
                            name:
                              type: string
                      post_date: 
                        type: string
                        format: date
                      post_number: 
                        type: string
                      rec_name:
                        type: string
                      state:
                        type: string
                    errors:
                      type: object
                    pagination:
                      properties:
                        page:
                          type: integer
                        per_page:
                          type: integer
                        total_pages:
                          type: integer
                        total_records:
                          type: integer
                    status:
                      type: integer
                    success_message:
                      type: string
              example:
                data:
                  company: 1
                  company_:
                    id: 1
                    name: Party 1
                  date: '2026-01-27'
                  description: some description here
                  id: 2
                  journal: 13
                  journal_:
                    id: 13
                    name: Statement
                  lines: []
                  number: '1'
                  origin: account.move,-1
                  origin_: {}
                  period: 79
                  period_:
                    id: 79
                    name: '1'
                  post_date: 
                  post_number: 
                  rec_name: '1'
                  state: draft
                errors: null
                pagination: null
                status: 201
                success_message: null
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'
    
