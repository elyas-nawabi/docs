                            id: 
                              type: integer
                            name:
                              type: string
                        description:
                          type: string
                        end_date:
                          type: string
                        group:
                          type: integer
                        group_:
                          type: object
                          properties:
                            id: 
                              type: integer
                            name:
                              type: string
                        id:
                          type: integer
                        invoice_account:
                          type: integer
                        invoice_account_:
                          type: object
                          properties:
                            id: 
                              type: integer
                            name:
                              type: string
                        invoice_base_amount: 
                          type: number
                          format: float
                        invoice_tax_amount: 
                          type: number
                          format: float
                        legal_notice: 
                          type: string
                        name:
                          type: string
                        parent: 
                          type: integer
                        parent_:
                          type: object
                          properties:
                            id: 
                              type: integer
                            name:
                              type: string
                        rate:
                          type: number
                          format: float
                        rec_name:
                          type: string
                        sequence:
                          type: integer
                        start_date:
                          type: string
                        template: 
                          type: integer
                        template_:
                          type: object
                          properties:
                            id: 
                              type: integer
                            name:
                              type: string
                        template_override:
                          type: boolean
                        type:
                          type: string
                        update_unit_price:
                          type: boolean
                    errors:
                      type: object
                    pagination:
                      items:
                        type: object
                      properties:
                        page:
                          type: integer
                        per_page:
                          type: integer
                        total_pages:
                          type: integer
                        total_records:
                          type: integer
                    status:
                      type: integer
                    success_message:
                      type: string
                      nullable: true
              example:
                data:
                  active: true
                  amount: 
                  childs: []
                  company: 1
                  company_:
                    id: 1
                    name: Party 1
                  credit_base_amount: 0
                  credit_note_account: 31
                  credit_note_account_:
                    id: 31
                    name: 1 - 1
                  credit_tax_amount: 0
                  currency: 1
                  currency_:
                    id: 1
                    name: Afghani
                  description: no desc
                  end_date: '2024-03-31'
                  group: 20
                  group_:
                    id: 20
                    name: '1'
                  id: 23
                  invoice_account: 30
                  invoice_account_:
                    id: 30
                    name: 1 - 1
                  invoice_base_amount: 0
                  invoice_tax_amount: 0
                  legal_notice: some legal notice
                  name: tx1
                  parent: 
                  parent_: {}
                  rate: 0.01
                  rec_name: tx1
                  sequence: 1
                  start_date: '2024-03-03'
                  template: 
                  template_: {}
                  template_override: false
                  type: percentage
                  update_unit_price: true
                error: null
                pagination: null
                status: 200
                success_message: null
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'
        '404':
          description: 404 Not Found.
          content:
            application/json:
              schema:
                $ref: '../../../api_doc.yaml#/components/schemas/HTTP404'

