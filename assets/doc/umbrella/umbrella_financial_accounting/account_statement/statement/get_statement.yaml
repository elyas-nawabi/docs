    post:
      tags:
        - statement
      summary: Get list of statements.
      description: Get list of statements.
      operationId: getStatements
      requestBody:
        description: If you wish to apply filtering, please set the criteria; otherwise, send an empty JSON request.
        content:
          application/json:
            schema:
              type: object
              $ref: '../../../../api_doc.yaml#/components/schemas/Filter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                  type: object
                  properties:
                    data:
                      type: array
                      properties:
                        date: 
                          type: string
                          format: date
                        id: 
                          type: integer
                        journal: 
                          type: integer
                        journal_:
                          $ref: '../../../../api_doc.yaml#/components/schemas/CommonType'
                        name: 
                          type: string
                        rec_name: 
                          type: string  
                    errors:
                      type: object
                    pagination:
                      properties:
                        page:
                          type: integer
                        per_page:
                          type: integer
                        total_pages:
                          type: integer
                        total_records:
                          type: integer
                    status:
                      type: integer
                    success_message:
                      type: string
                      nullable: true
              example:
                data:
                  - date: '2024-03-14'
                    id: 1
                    journal: 6
                    journal_:
                      id: 6
                      name: statementj1
                    name: st1
                    rec_name: st1
                errors: null
                pagination:
                  page: 1
                  per_page: 100
                  total_pages: 1
                  total_records: 12
                status: 200
                success_message: null
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../../../api_doc.yaml#/components/schemas/HTTP401'
    
   