post:
  tags:
    - tax rule template
  summary: Create a tax rule template.
  description: |
    Create a global tax rule template. Tax rule templates are materialized for a company when a chart of accounts is applied via `POST /accounts/create-coa-from-template`.
  operationId: postTaxRuleTemplate
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          $ref: 'schemas/create-tax-rule-template.yaml'
  responses:
    '201':
      description: Created
      content:
        application/json:
          schema:
            $ref: 'schema.yaml'
    '401':
      description: >-
        401 Unauthorized: The server could not verify that you are
        authorized to access the URL requested. You either supplied the
        wrong credentials (e.g. a bad password), or your browser doesn't
        understand how to supply the credentials required.
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'

delete:
  tags:
    - tax rule template
  summary: Delete tax rule templates.
  description: Delete one or more tax rule template records by id.
  operationId: deleteTaxRuleTemplate
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          $ref: '../../../api_doc.yaml#/components/schemas/DeleteRequestBody'
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/DeleteApiResponse'
    '401':
      description: >-
        401 Unauthorized: The server could not verify that you are
        authorized to access the URL requested. You either supplied the
        wrong credentials (e.g. a bad password), or your browser doesn't
        understand how to supply the credentials required.
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'
