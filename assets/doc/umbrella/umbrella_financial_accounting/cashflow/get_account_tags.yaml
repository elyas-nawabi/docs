                  is_non_cash_expense: true
                  is_operating_asset: false
                  is_operating_liability: false
                  is_investing: false
                  is_financing: false
                  is_revenue: false
                  is_expense: false
                  create_date: '2024-01-15T10:30:00'
                  create_uid: 1
                  create_uid_:
                    id: 1
                    name: Administrator
                  write_date: null
                  write_uid: null
                  write_uid_: {}
                - id: 2
                  name: Operating Asset
                  sequence: 2
                  is_non_cash_expense: false
                  is_operating_asset: true
                  is_operating_liability: false
                  is_investing: false
                  is_financing: false
                  is_revenue: false
                  is_expense: false
                  create_date: '2024-01-15T10:31:00'
                  create_uid: 1
                  create_uid_:
                    id: 1
                    name: Administrator
                  write_date: null
                  write_uid: null
                  write_uid_: {}
                errors: null
                pagination:
                  page: 1
                  per_page: 100
                  total_pages: 1
                  total_records: 2
                status: 200
                success_message: null
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
