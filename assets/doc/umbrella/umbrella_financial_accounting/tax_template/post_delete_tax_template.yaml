post:
  tags:
    - tax template
  summary: Create a tax template.
  description: |
    Create a global tax template node. Use `parent` to attach a child tax under an existing template, or omit `parent` for a root tax.

    Tax templates are materialized for a company when a chart of accounts is applied via `POST /accounts/create-coa-from-template`.
  operationId: postTaxTemplate
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          $ref: 'schemas/create-tax-template.yaml'
  responses:
    '201':
      description: Created
      content:
        application/json:
          schema:
            $ref: 'schema.yaml'
    '401':
      description: >-
        401 Unauthorized: The server could not verify that you are
        authorized to access the URL requested. You either supplied the
        wrong credentials (e.g. a bad password), or your browser doesn't
        understand how to supply the credentials required.
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'

delete:
  tags:
    - tax template
  summary: Delete tax templates.
  description: Delete one or more tax template records by id.
  operationId: deleteTaxTemplate
  requestBody:
    required: true
    content:
      application/json:
        schema:
          type: object
          $ref: '../../../api_doc.yaml#/components/schemas/DeleteRequestBody'
  responses:
    '200':
      description: OK
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/DeleteApiResponse'
    '401':
      description: >-
        401 Unauthorized: The server could not verify that you are
        authorized to access the URL requested. You either supplied the
        wrong credentials (e.g. a bad password), or your browser doesn't
        understand how to supply the credentials required.
      content:
        application/json:
          schema:
            $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'
