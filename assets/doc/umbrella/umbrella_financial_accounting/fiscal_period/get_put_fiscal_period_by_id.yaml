get:
      tags:
        - fiscal period
      summary: Get one fiscal period.
      description: Get one fiscal period.
      operationId: getFiscalPeriodById
      parameters:
        - name: obj_id
          in: path
          schema:
            type: integer
          rquired: true
          example: 2
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                  type: object
                  properties:
                    data:
                      type: object
                      properties:
                        company:
                          type: integer
                        company_:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                        end_date:
                          type: string
                          format: date
                        id:
                          type: integer
                        name:
                          type: string
                        post_move_sequence:
                          type: integer
                        post_move_sequence_:
                          type: object
                          properties:
                            id:
                              type: integer
                            name:
                              type: string
                        start_date:
                          type: string
                          format: date
                        state:
                          type: string
                        type:
                          type: string
                    errors:
                      type: object
                    pagination:
                      items:
                        type: object
                      properties:
                        page:
                          type: integer
                        per_page:
                          type: integer
                        total_pages:
                          type: integer
                        total_records:
                          type: integer
                    status:
                      type: integer
                    success_message:
                      type: string
                      nullable: true
              example:
                data:
                  company: 1
                  company_:
                    id: 1
                    name: Party 1
                  end_date: '2024-02-29'
                  fiscalyear: 2
                  fiscalyear_:
                    id: 2
                    name: '2024'
                  id: 14
                  name: "2024-02"
                  post_move_sequence: 4
                  post_move_sequence_:
                    id: 4
                    name: '2024'
                  start_date: '2024-02-01'
                  state: "open"
                  type: "standard"
                error: null
                pagination: null
                status: 200
                success_message: null
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'
        '404':
          description: 404 Not Found.
          content:
            application/json:
              schema:
                $ref: '../../../api_doc.yaml#/components/schemas/HTTP404'

