get:
      tags:
        - write off
      summary: Get one write off.
      description: Get one write off.
      operationId: getWriteOffById
      parameters:
        - name: obj_id
          in: path
          schema:
            type: integer
          rquired: true
          example: 2
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                  type: object
                  properties:
                    data:
                      type: object
                      properties:
                        active:
                          type: boolean
                        company:
                          type: integer
                        company_:
                          type: object
                          properties:
                            label:
                              type: string
                            value:
                              type: integer
                        credit_account: 
                          type: integer
                        credit_account_:
                          type: object
                          properties:
                            label: 
                              type: string
                            value: 
                              type: integer
                        debit_account: 
                          type: integer
                        debit_account_:
                          type: object
                          properties:
                            label: 
                              type: string
                            value: 
                              type: integer
                        id: 
                          type: integer
                        journal: 
                          type: integer
                        journal_:
                          type: object
                          properties:
                            label: 
                              type: string
                            value: 
                              type: integer
                        name:  
                          type: string
                        rec_name:  
                          type: string
                    errors:
                      type: object
                    pagination:
                      items:
                        type: object
                      properties:
                        page:
                          type: integer
                        per_page:
                          type: integer
                        total_pages:
                          type: integer
                        total_records:
                          type: integer
                    status:
                      type: integer
                    success_message:
                      type: string
                      nullable: true
              example:
                data:
                  active: true
                  company: 1
                  company_:
                    label: Party 1
                    value: 1
                  credit_account: 2
                  credit_account_:
                    label: Main Cash
                    value: 2
                  debit_account: 2
                  debit_account_:
                    label: Main Cash
                    value: 2
                  id: 1
                  journal: 6
                  journal_:
                    label: Currency Exchange
                    value: 6
                  name: wr1
                  rec_name: wr1
                error: null
                pagination: null
                status: 200
                success_message: null
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
