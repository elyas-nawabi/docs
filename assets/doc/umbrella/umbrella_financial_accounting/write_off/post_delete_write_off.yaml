post:
      tags:
        - write off
      summary: Create a write off.
      description: Create a write off.
      operationId: postWriteOffById
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              $ref: 'schemas/create-write-off.yaml'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                  type: object
                  properties:
                    data: 
                      type: object
                      properties:
                        active:
                          type: boolean
                        company:
                          type: integer
                        credit_account: 
                          type: integer
                        debit_account: 
                          type: integer
                        journal: 
                          type: integer
                        name:  
                          type: string
                        rec_name:  
                          type: string
                    errors:
                      type: object
                    pagination:
                      properties:
                        page:
                          type: integer
                        per_page:
                          type: integer
                        total_pages:
                          type: integer
                        total_records:
                          type: integer
                    status:
                      type: integer
                    success_message:
                      type: string
              example:
                data:
                  active: true
                  company: 1
                  company_:
                    id: 1
                    name: Party 1
                  credit_account: 2
                  credit_account_:
                    id: 2
                    name: Main Cash
                  debit_account: 2
                  debit_account_:
                    id: 2
                    name: Main Cash
                  id: 1
                  journal: 6
                  journal_:
                    id: 6
                    name: Currency Exchange
                  name: wr1
                  rec_name: wr1
                errors: null
                pagination: null
                status: 200
                success_message: null
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'

