    post:
      tags:
        - payment group
      summary: Get list of payment groups.
      description: Get list of payment groups.
      operationId: getPaymentGroup
      requestBody:
        description: If you wish to apply filtering, please set the criteria; otherwise, send an empty JSON request.
        content:
          application/json:
            schema:
              type: object
              $ref: '../../../../api_doc.yaml#/components/schemas/Filter'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                  type: object
                  properties:
                    data:
                      type: array
                      properties:
                          id: 
                            type: integer
                          journal: 
                            type: integer
                          journal_:
                            type: object
                            properties:
                              id: 
                                type: integer
                              name: 
                                type: string
                          kind: 
                            type: string
                          number: 
                            type: string
                          payment_amount: 
                            type: integer
                          payment_amount_succeeded: 
                            type: integer
                          payment_count: 
                            type: integer
                          rec_name: 
                            type: string  
                    errors:
                      type: object
                    pagination:
                      properties:
                        page:
                          type: integer
                        per_page:
                          type: integer
                        total_pages:
                          type: integer
                        total_records:
                          type: integer
                    status:
                      type: integer
                    success_message:
                      type: string
                      nullable: true
              example:
                data:
                  - id: 1
                    journal: 10
                    journal_:
                      id: 10
                      name: payment_journal_test
                    kind: receivable
                    number: '1'
                    payment_amount: 6
                    payment_amount_succeeded: 5
                    payment_count: 6
                    rec_name: '1'
                errors: null
                pagination:
                  page: 1
                  per_page: 100
                  total_pages: 1
                  total_records: 12
                status: 200
                success_message: null
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../../../api_doc.yaml#/components/schemas/HTTP401'
    
    