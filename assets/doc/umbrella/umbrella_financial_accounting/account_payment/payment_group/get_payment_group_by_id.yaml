                        journal:
                          type: integer
                        journal_:
                          $ref: '../../../../api_doc.yaml#/components/schemas/CommonType'
                        kind: 
                          type: string
                        number: 
                          type: string
                        payment_amount: 
                          type: integer
                        payment_amount_succeeded: 
                          type: integer
                        payment_complete: 
                          type: boolean
                        payment_count: 
                          type: integer
                        process_method: 
                          type: string
                        rec_name: 
                          type: string
                    errors:
                      type: object
                    pagination:
                      items:
                        type: object
                      properties:
                        page:
                          type: integer
                        per_page:
                          type: integer
                        total_pages:
                          type: integer
                        total_records:
                          type: integer
                    status:
                      type: integer
                    success_message:
                      type: string
                      nullable: true
              example:
                data:
                  company: 1
                  company_:
                    id: 1
                    name: Party 1
                  currency: 1
                  currency_:
                    id: 1
                    name: Afghani
                  id: 1
                  journal: 10
                  journal_:
