get:
      tags:
        - payment group
      summary: Get one payment group.
      description: Get one payment group.
      operationId: getPaymentGroupById
      parameters:
        - name: obj_id
          in: path
          schema:
            type: integer
          rquired: true
          example: 2
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                  type: object
                  properties:
                    data:
                      type: object
                      properties:
                        company: 
                          type: integer
                        company_:
                          $ref: '../../../../api_doc.yaml#/components/schemas/CommonType'
                        currency: 
                          type: integer
                        currency_:
                          $ref: '../../../../api_doc.yaml#/components/schemas/CommonType'
                        id: 
