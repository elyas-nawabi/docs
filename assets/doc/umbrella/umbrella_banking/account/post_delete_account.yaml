post:
      tags:
        - account
      summary: Create an account.
      description: Create an account.
      operationId: postAccountById
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              $ref: 'schemas/create-account.yaml'
      responses:
        '201':
          description: OK
          content:
            application/json:
              schema:
                $ref: 'schema.yaml'
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'

delete:
      tags:
        - account
      summary: Delete accounts.
      description: Delete accounts.
      operationId: deleteAccountsById
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              $ref: '../../../api_doc.yaml#/components/schemas/DeleteRequestBody'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '../../../api_doc.yaml#/components/schemas/DeleteApiResponse'
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'
    