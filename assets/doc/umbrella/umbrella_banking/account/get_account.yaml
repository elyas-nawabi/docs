    post:
      tags:
        - account
      summary: Get account details.
      description: Get account details.
      operationId: getAccounts
      requestBody:
        description: If you wish to apply filtering, please set the criteria; otherwise, send an empty JSON request.
        content:
          application/json:
            schema:
              type: object
              $ref: '../../../api_doc.yaml#/components/schemas/Filter'
      responses:
        '200':
          description: List of accounts.
          content:
            application/json:
              schema:
                  type: object
                  properties:
                    data:
                      type: array
                      properties:
                          bank: 
                            type: integer
                          bank_:
                            type: object
                            properties:
                              id: 
                                type: integer
                              name: 
                                type: string
                          currency: 1
                          currency_:
                            type: object
                            properties:
                              id: 
                                type: integer
                              name: 
                                type: string
                          id: 
                            type: integer
                          rec_name: 
                            type: string
                    errors:
                      type: object
                    pagination:
                      type: object
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_pages:
                        type: integer
                      total_records:
                        type: integer
                    status:
                      type: integer
                    success_message:
                      type: string
                      nullable: true
              example:
                data:
                  - bank: 
                    bank_: {}
                    currency: 1
                    currency_:
                      id: 1
                      name: Afghani
                    id: 2
                    rec_name: "(2) [AFN]"
                error: null
                pagination:
                  page: 1
                  per_page: 100
                  total_pages: 1
                  total_records: 9
                status: 200
                success_message: null
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '../../../api_doc.yaml#/components/schemas/HTTP401'
    
    