  '/party/parties':
    $ref: 'umbrella/umbrella_party/party/get_post_delete_party.yaml'
  '/party/parties/{obj_id}':
    $ref: 'umbrella/umbrella_party/party/get_put_party_by_id.yaml'
  '/party/categories':
    $ref: 'umbrella/umbrella_party/category/get_post_delete_categories.yaml'
  '/party/categories/{obj_id}':
    $ref: 'umbrella/umbrella_party/category/get_put_categories_by_id.yaml'
  '/party/contact-mechanisms':
    $ref: 'umbrella/umbrella_party/contact_mechanism/get_post_delete_contact_mechanism.yaml'
  '/party/contact-mechanisms/{obj_id}':
    $ref: 'umbrella/umbrella_party/contact_mechanism/get_put_contact_mechanism.yaml'
  '/party/address':
    $ref: 'umbrella/umbrella_party/address/get_post_delete_address.yaml'
  '/party/address/{obj_id}':
    $ref: 'umbrella/umbrella_party/address/get_put_address_by_id.yaml'
  '/administration/sequence_types':
    $ref: 'umbrella/umbrella_administration/sequence_type/get_post_delete_sequence_types.yaml'
  '/administration/sequence_types/{obj_id}':
    $ref: 'umbrella/umbrella_administration/sequence_type/get_put_sequence_types_by_id.yaml'
  
  '/administration/sequences':
