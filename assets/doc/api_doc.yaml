openapi: 3.1.0
info:
  description: >
    ## UMBRELLA API Documentation Description:

    Welcome to the official documentation for the UMBRELLA RESTful API. 

    This comprehensive guide is designed to assist developers and integrators, 

    in effectively utilizing the power of our API.

    Our RESTful API provides:

    A simple and efficient way to access and interact 

    with, currencies, finances ....... 

    Whether you're building 

    a web application, mobile app, or integrating 

    with other services, our API offers the tools 

    you need to streamline your development process 

    and unlock the full potential of your project.

    In this documentation, you'll find detailed 

    information on how to make API requests, 

    authentication procedures, available endpoints, 

    request/response examples, error handling, 

    and best practices for integrating UMBRELLA

    into your projects.


    ## Authorization:

    You can authorize your requests using this authorization method:

    - TOKEN


    ## TOKEN

    - The endpoints are authorized using a TOKEN.

    - To authorize requests, please add a Token using the 'Authorize' button
    with the following format:
      ### "Bearer user-token"
  version: 1.0.0
  contact:
    name: API Support
    email: shadab@gmail.com
servers:
  - url: 'http://api-alpha.umbrellaerp.com'
tags:
  - name: currency
    description: currency - currency data handling.
  - name: scheduled rate update
    description: scheduled rate update - scheduled rate update data handling.
  - name: fiscal year
    description: fiscal year - fiscal year data handling.
  - name: auth
    description: auth - auth data handling.
  - name: party
    description: party - party data handling.
  - name: category
    description: category - category data handling.
paths:
  '/currencies':
    get:
      tags:
        - currency
      summary: Get currency details.
      description: Get currency details.
      operationId: getCurrencies
      responses:
        '200':
          description: List of currencies.
          content:
            application/json:
              schema:
                type: object
                items:
                  type: object
                  properties:
                    data:
                      type: array
                      properties:
                        type: object
                        active:
                          type: boolean
                        code:
                          type: string
                        id:
                          type: integer
                        name:
                          type: string
                        numeric_code:
                          type: string
                        rate:
                          type: float
                        symbol:
                          type: string
                    errors:
                      type: object
                    pagination:
                      type: object
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total_pages:
                        type: integer
                      total_records:
                        type: integer
                    status:
                      type: integer
                    success_message:
                      type: string
              required:
                - code
              example:
                data:
                  - active: true
                    code: "AFN"
                    id: 1
                    name: "Afghani"
                    numeric_code: "001"
                    rate: 0
                    symbol: "AFN"
                errors: null
                pagination:
                  page: 1
                  per_page: 100
                  total_pages: 1
                  total_records: 1
                status: 200
                success_message: null
        '401':
          description: >-
            401 Unauthorized: The server could not verify that you are
            authorized to access the URL requested. You either supplied the
            wrong credentials (e.g. a bad password), or your browser doesn't
            understand how to supply the credentials required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTP401'
    post:
      tags:
        - currency
      summary: Create a currency.
      description: Create a currency.
      operationId: postCurrencyById
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              $ref: '#/components/schemas/CreateCurrency'
      responses:
        '201':
