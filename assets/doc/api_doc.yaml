                          type: boolean
                        code:
                          type: string
                        digits:
                          type: integer
                        id:
                          type: integer
                        name:
                          type: string
                        numeric_code:
                          type: string
                        rate:
                          type: float
                        rates:
                          type: array
                        rounding:
